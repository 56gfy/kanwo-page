<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF3F6">
<title>我们的小秘密</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(128% 76% at 50% 0%,#FFFDFE 0%,#FFF2F6 42%,#FBE1EA 100%);
  background-attachment:fixed;
  color:#4A2B38;
  font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
main{padding:calc(env(safe-area-inset-top,0px) + 34px) 20px
             calc(env(safe-area-inset-bottom,0px) + 90px);
  max-width:640px;margin:0 auto}

.hd{text-align:center;margin-bottom:18px}
.to{margin:0 0 14px;font-size:12px;letter-spacing:.44em;text-indent:.44em;color:#D98BA6}
h1{margin:0;font-family:"Songti SC","STSong","SimSun",serif;
  font-size:clamp(28px,8.6vw,38px);line-height:1.26;font-weight:600;
  letter-spacing:.05em;color:#43202F}
h1 .sub{display:block;margin-top:9px;font-size:.56em;font-weight:400;
  letter-spacing:.2em;text-indent:.2em;color:#E0618F}
.rule{width:46px;height:1px;margin:22px auto 0;
  background:linear-gradient(90deg,transparent,#F2A8C4,transparent)}

.bar{display:flex;align-items:center;justify-content:center;gap:7px;
  margin:14px 0 26px;font-size:12px;color:#A98A97;letter-spacing:.04em}
.dot{width:7px;height:7px;border-radius:50%;background:#D8C7CE;flex:0 0 auto;
  transition:background .3s}
.dot.on{background:#6FBF8F}
.dot.off{background:#E3A9B6}

/* ---------- 信笺卡片 ---------- */
.card{position:relative;background:#FFFBFC;border-radius:4px;
  padding:20px 18px 16px;margin:0 0 18px;
  box-shadow:0 14px 31px -18px rgba(176,88,120,.38),
             0 3px 9px -5px rgba(176,88,120,.15)}
.card .no{position:absolute;top:-1px;left:14px;
  font-family:"Songti SC","STSong",serif;font-size:11px;
  letter-spacing:.2em;color:#E5AFC4;background:#FFFBFC;padding:0 6px;
  transform:translateY(-50%)}
.ed{display:block;width:100%;min-height:66px;
  font-family:"Songti SC","STSong","SimSun",serif;
  font-size:15px;line-height:2;letter-spacing:.02em;color:#4A2B38;
  background:transparent;border:0;outline:0;padding:2px 44px 2px 0;resize:none;
  overflow:hidden;word-break:break-word}
/* padding-right 44px：给右上角 40px 的「×」让位，文字不会钻到按钮底下 */
.ed:empty:before{content:attr(data-ph);color:#CBB2BD}
.ed:focus{background:linear-gradient(180deg,transparent 96%,#F6D3E0 96%)}
/* 删除按钮：视觉上是一枚小「×」，但触摸区域给足 40px（手指点不中会很难受） */
.del{position:absolute;top:2px;right:2px;width:40px;height:40px;
  border:0;background:transparent;color:#DFC3CE;font-size:18px;line-height:1;
  cursor:pointer;border-radius:50%;padding:0}
.del:active{background:#FDEDF3;color:#E0618F}

/* ---------- 底部操作 ---------- */
.tools{display:flex;gap:10px;justify-content:center;margin:8px 0 22px}
.btn{flex:0 0 auto;border:1px solid #F0C9D8;background:#FFFBFC;color:#C4497A;
  font-size:14px;letter-spacing:.08em;padding:10px 20px;border-radius:999px;
  cursor:pointer;font-family:inherit}
.btn:active{background:#FDEDF3}
.btn.solid{background:#E0618F;border-color:#E0618F;color:#fff}
.btn.solid:active{background:#CE4E7C}

.foot{text-align:center;font-size:11.5px;line-height:1.9;color:#BFA0AD;
  letter-spacing:.05em;font-family:"Songti SC","STSong",serif}
.foot .k{color:#E0618F}
.tip{text-align:center;font-size:11.5px;color:#C2A6B1;margin:0 0 18px;
  letter-spacing:.03em}
@media (prefers-reduced-motion:no-preference){
  .card{animation:up .5s ease both}
  @keyframes up{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<main>
  <div class="hd">
    <p class="to">只给你一个人看</p>
    <h1>我们的小秘密<span class="sub">写下来，对面就看得见</span></h1>
    <div class="rule"></div>
  </div>

  <div class="bar">
    <i class="dot" id="dot"></i><span id="stxt">正在连上…</span>
  </div>
  <p class="tip">点一下就能改，改完自动传过去</p>

  <div id="list"></div>

  <div class="tools">
    <button class="btn" id="add">加一页</button>
    <button class="btn solid" id="push">立刻传过去</button>
  </div>

  <p class="foot">你那边改的，我这边也看得见<br>
    <span class="k" id="who">—</span></p>
</main>

<script>
(function(){
  var TE = new TextEncoder(), TD = new TextDecoder();
  function u16(n){ return [ (n>>8)&255, n&255 ]; }
  function len(n){ var o=[]; do { var d=n%128; n=Math.floor(n/128); if(n>0) d|=128; o.push(d); } while(n>0); return o; }
  function cat(){ var t=0,i; for(i=0;i<arguments.length;i++) t+=arguments[i].length;
    var o=new Uint8Array(t),p=0; for(i=0;i<arguments.length;i++){ o.set(arguments[i],p); p+=arguments[i].length; } return o; }
  function mstr(s){ var b=TE.encode(s); return cat(new Uint8Array(u16(b.length)), b); }
  function packet(type, flags, body){ var L=len(body.length);
    var h=new Uint8Array(1+L.length); h[0]=(type<<4)|flags; h.set(L,1); return cat(h, body); }

  function Mini(url, opts){
    var self=this;
    opts = opts || {};
    self.url=url; self.clientId=opts.clientId||('c'+Math.random().toString(36).slice(2,10));
    self.keepalive=opts.keepalive||45;
    self.will=opts.will||null;
    self.onopen=null; self.onconnect=null; self.onmessage=null; self.onclose=null; self.onerror=null;
    self.connected=false; self.ended=false; self.reconnects=0;
    self.pid=0; self.buf=new Uint8Array(0); self.pingTimer=null; self.tries=0;

    function fail(msg){ if(self.onerror) self.onerror(msg); }

    function handle(b0, p){
      var type=b0>>4;
      if(type===2){                                  // CONNACK
        if(p.length<2) return;
        var rc=p[1];
        if(rc===0){
          self.connected=true; self.tries=0;
          self.pingTimer=setInterval(function(){ raw(packet(12,0,new Uint8Array(0))); }, self.keepalive*1000/2);
          if(self.onconnect) self.onconnect();
        } else { fail('CONNACK rc='+rc); self.close(); }
      } else if(type===3){                           // PUBLISH
        var qos=(b0>>1)&3, retain=(b0&1)===1;
        var tl=(p[0]<<8)|p[1]; var off=2+tl;
        if(p.length<off) return;
        var topic=TD.decode(p.subarray(2,off));
        if(qos>0) off+=2;
        var payload=TD.decode(p.subarray(off));
        if(self.onmessage) self.onmessage(topic, payload, retain);
      } else if(type===9){                           // SUBACK
        if(self.onsuback) self.onsuback(p);
      }
    }

    function onData(u8){
      var nb=new Uint8Array(self.buf.length+u8.length);
      nb.set(self.buf); nb.set(u8, self.buf.length); self.buf=nb;
      while(self.buf.length>=2){
        var i=1, mult=1, l=0, done=false;
        while(i<self.buf.length && i<=4){
          var d=self.buf[i]; l+=(d&127)*mult; mult*=128; i++;
          if((d&128)===0){ done=true; break; }
        }
        if(!done) return;
        if(self.buf.length < i+l) return;
        handle(self.buf[0], self.buf.slice(i, i+l));
        self.buf=self.buf.slice(i+l);
      }
    }

    var ws=null;
    function raw(bytes){ try{ if(ws && ws.readyState===1) ws.send(bytes); }catch(e){ fail(String(e)); } }

    self.connect=function(){
      if(self.ended) return;
      try{ ws=new WebSocket(self.url); }catch(e){ fail(String(e)); return; }
      ws.binaryType='arraybuffer';
      ws.onopen=function(){
        var flags = (1<<1);                                   // clean session
        var payload = mstr(self.clientId);
        if(self.will){ flags |= (1<<2)|(1<<5); payload = cat(payload, mstr(self.will.topic), TE.encode(self.will.payload||'')); }
        var vh = cat(mstr('MQTT'), new Uint8Array([4, flags]), new Uint8Array(u16(self.keepalive)));
        raw(packet(1, 0, cat(vh, payload)));
        if(self.onopen) self.onopen();
      };
      ws.onmessage=function(e){ onData(new Uint8Array(e.data)); };
      ws.onerror=function(){ fail('websocket error'); };
      ws.onclose=function(){
        self.connected=false;
        if(self.pingTimer){ clearInterval(self.pingTimer); self.pingTimer=null; }
        if(self.onclose) self.onclose();
        if(!self.ended && self.tries<8){
          self.tries++;
          var wait=Math.min(30000, 1500*Math.pow(2,self.tries-1));
          setTimeout(self.connect, wait);
        }
      };
    };

    self.subscribe=function(topic, qos){
      if(!self.connected) return false;
      self.pid++;
      raw(packet(8, 2, cat(new Uint8Array(u16(self.pid)), mstr(topic), new Uint8Array([qos||0]))));
      return true;
    };
    self.publish=function(topic, payload, opt){
      if(!self.connected) return false;
      opt=opt||{};
      raw(packet(3, opt.retain?1:0, cat(mstr(topic), TE.encode(payload==null?'':String(payload)))));
      return true;
    };
    self.close=function(){ self.ended=true;
      if(self.pingTimer){ clearInterval(self.pingTimer); self.pingTimer=null; }
      try{ raw(packet(14,0,new Uint8Array(0))); }catch(e){}
      try{ if(ws) ws.close(); }catch(e){}
      self.connected=false;
    };
    self.isConnected=function(){ return self.connected; };
  }
  window.MiniMQTT = Mini;
})();

</script>
<script>
(function(){
  "use strict";
  var Q = (function(){ var o={},s=location.search.replace(/^\?/,''); if(s) s.split('&').forEach(function(kv){
      var a=kv.split('='); if(a[0]) o[decodeURIComponent(a[0])]=decodeURIComponent(a[1]||''); }); return o; })();
  var ROOM = (Q.get ? Q.get('r') : Q['r'] || '').replace(/[^A-Za-z0-9_-]/g,'').slice(0,32) || 'womens-own-secret';
  var LS_KEY = 'kwsec_' + ROOM;
  var T_DOC = 'kws/sec/' + ROOM + '/doc';
  var T_WHO = 'kws/sec/' + ROOM + '/who/';
  var BROKER = 'wss://broker.hivemq.com:8884/mqtt';
  var CID = 'c' + Math.random().toString(36).slice(2,10);
  var ME = (Q.get ? Q.get('n') : Q['n'] || '') || '';

  var DEFAULT_TEXT = [
    '把今天想说的写在这里',
    '这里只有我们两个人看得到',
    '想我了就写一句'
  ];

  var state = null;
  var cli = null;
  var saveTimer = null;
  var remotePending = null;
  var els = {};

  /* ---------- 观测计数器（排障用：谁发了、谁收了、几时连上） ---------- */
  window.__kwStats = { connectAt:0, pubOK:0, pubSkipNoConn:0, recvDoc:0,
                       recvDocBeforeFocus:0, mergeGrew:0, blocksBefore:0, blocksAfter:0 };

  /* ---------- 数据 ----------
     每页各带自己的时间戳：两人改不同页时按页合并，互不覆盖。
     删掉的页留一条墓碑（del:true），否则对面会把删掉的页又补回来。 */
  function newDoc(){
    return { v:2, ts: 0, dirty:false, blocks: DEFAULT_TEXT.map(function(t,i){
      return { id:'b'+i, t:t, ts:0 }; }) };
  }
  function loadLocal(){
    try{ var s = localStorage.getItem(LS_KEY); if(s){ var d = JSON.parse(s);
      if(d && d.blocks && d.blocks.length){ return d; } } }catch(e){}
    return null;
  }
  function persist(){
    try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
  }
  function findB(id){
    for(var i=0;i<state.blocks.length;i++){ if(state.blocks[i].id===id) return state.blocks[i]; }
    return null;
  }
  /** 按页合并：同 id 取 ts 大的那份；墓碑照搬；对面独有的页补进来。 */
  function mergeDoc(mine, theirs){
    if(!theirs || !theirs.blocks) return mine;
    /* 本机还没有稿子 → 直接采纳对面的（不能拿 null 往下跑，会抛异常静默丢消息） */
    if(!mine || !mine.blocks){
      return { v:2, ts:theirs.ts||0, dirty:false, blocks:theirs.blocks.slice() };
    }
    var byId = {}, order = [], k, i;
    function take(b){
      if(!byId[b.id]){ byId[b.id] = b; order.push(b.id); return; }
      if((b.ts||0) > (byId[b.id].ts||0)) byId[b.id] = b;
    }
    for(i=0;i<mine.blocks.length;i++) take(mine.blocks[i]);
    for(i=0;i<theirs.blocks.length;i++) take(theirs.blocks[i]);
    var out = [];
    for(i=0;i<order.length;i++){
      var b = byId[order[i]];
      if(!b.del) out.push(b);
    }
    if(!out.length) out = mine.blocks;      /* 全被删空 → 保留本机，别变白页 */
    return { v:2, ts: Math.max(mine.ts||0, theirs.ts||0), dirty:true, blocks: out };
  }

  /* ---------- 渲染 ---------- */
  var CN = ['一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五'];
  function render(){
    var list = document.getElementById('list');
    list.innerHTML = '';
    els = {};
    var live = [];
    for(var q=0;q<state.blocks.length;q++){
      if(!state.blocks[q].del) live.push(state.blocks[q]);
    }
    live.forEach(function(b, i){
      var card = document.createElement('div');
      card.className = 'card';
      card.style.animationDelay = (i*45) + 'ms';

      var no = document.createElement('span');
      no.className = 'no';
      no.textContent = '第 ' + (CN[i] || (i+1)) + ' 页';

      var ed = document.createElement('div');
      ed.className = 'ed';
      ed.setAttribute('contenteditable', 'true');
      ed.setAttribute('data-ph', '在这里写点什么');
      ed.setAttribute('spellcheck', 'false');
      ed.textContent = b.t || '';
      ed.addEventListener('input', function(){ onInput(b.id); });
      ed.addEventListener('focus', function(){ onFocusIn(); });
      ed.addEventListener('blur', function(){ onBlurOut(b.id); });

      var del = document.createElement('button');
      del.className = 'del';
      del.type = 'button';
      del.setAttribute('aria-label', '删掉这页');
      del.textContent = '\u00d7';
      del.addEventListener('click', function(){
        if(state.blocks.length <= 1) return;
        var i, out = [];
        for(i=0;i<state.blocks.length;i++){
          var x = state.blocks[i];
          if(x.id === b.id){ x.del = true; x.ts = Date.now(); }  /* 墓碑：对面才不会又补回来 */
          out.push(x);
        }
        state.blocks = out;
        state.dirty = true;
        render(); scheduleSave();
      });

      card.appendChild(no); card.appendChild(del); card.appendChild(ed);
      list.appendChild(card);
      els[b.id] = ed;
      autoGrow(ed);
    });
  }
  function autoGrow(el){ el.style.height = 'auto'; el.style.height = (el.scrollHeight+2) + 'px'; }
  window.__kwAutoGrow = autoGrow;   /* 给审计探针调用 */

  /* ---------- 编辑 ---------- */
  function onFocusIn(){ /* 输入中：不接受远端整表覆盖 */ }
  function onBlurOut(id){
    if(remotePending){ var d = remotePending; remotePending = null; absorb(d); }
  }
  /* 失焦后若又有新稿子到达，也要并进来（否则一次失焦只并一批） */
  function onInput(id){
    var el = els[id]; if(!el) return;
    autoGrow(el);
    var b = findB(id);
    if(!b) return;
    b.t = el.innerText.replace(/\u00a0/g,' ');
    b.ts = Date.now();          /* 这一页刚被改过 */
    state.dirty = true;
    scheduleSave();
  }
  function scheduleSave(){
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){ saveTimer=null; push(true); }, 600);
  }
  function editingNow(){
    var a = document.activeElement;
    return !!(a && a.classList && a.classList.contains('ed'));
  }
  function push(quiet, force){
    if(!state) return;
    /* 没动过的空壳不许广播 —— 否则对面已写好的内容会被这份默认文本盖掉 */
    if(!force && !state.dirty) return;
    state.ts = Date.now();
    state.dirty = true;
    persist();
    if(cli && cli.isConnected()){
      /* 带上 cid：MQTT 会把消息投回给发布者自己，靠它认出来并丢弃 */
      var out = { v:state.v, ts:state.ts, cid:CID, blocks:state.blocks };
      cli.publish(T_DOC, JSON.stringify(out), {retain:true});
      window.__kwStats.pubOK++;
    } else {
      /* 没连上就跳过 = 这次改动谁都不知道，必须记下来，否则是静默丢数据 */
      window.__kwStats.pubSkipNoConn++;
    }
    if(!quiet) flash('已传过去');
  }

  /* ---------- 接收 ---------- */
  function absorb(d){
    /* 不整表覆盖 —— 按页合并，谁改得晚听谁的（两人改不同页时都保得住） */
    if(!d || !d.blocks || !d.blocks.length) return;
    state = mergeDoc(state, d);
    persist();
    render();
  }
  function onMessage(topic, payload){
    var d;
    try{ d = JSON.parse(payload); }catch(e){ return; }
    if(topic === T_DOC){
      if(!d || !d.blocks) return;
      /* 自己发的会被 broker 投回给自己 —— 丢弃，否则会把自己的稿子当对面的 */
      if(d.cid && d.cid === CID){
        window.__kwStats.recvOwnEcho = (window.__kwStats.recvOwnEcho || 0) + 1;
        return;
      }
      window.__kwStats.recvDoc++;
      if(!editingNow()) window.__kwStats.recvDocBeforeFocus++;
      var _b4 = state ? state.blocks.length : 0;
      if(!state){ absorb(d); return; }
      /* 正在打字 → 先记下，失焦后再并（免得光标被抢、字被打断） */
      /* 正在打字 → 攒着，失焦后再并。注意是【累加】不是覆盖：
         单槽覆盖时，后到的一条会把先前对面的改动顶掉（实测 B 因此看不到 A 的字） */
      if(editingNow()){
        remotePending = remotePending ? mergeDoc(remotePending, d) : d;
        return;
      }
      absorb(d);
      window.__kwStats.blocksBefore = _b4;
      window.__kwStats.blocksAfter = state.blocks.length;
    } else if(topic.indexOf(T_WHO) === 0){
      var cid = topic.slice(T_WHO.length);
      if(cid === CID) return;
      if(d && d.online){
        document.getElementById('who').textContent = (d.n || '对方') + ' 也在这一页';
      } else {
        document.getElementById('who').textContent = '等你来写';
      }
    }
  }

  /* ---------- 状态 ---------- */
  function setSt(txt, cls){
    document.getElementById('stxt').textContent = txt;
    var d = document.getElementById('dot');
    d.className = 'dot' + (cls ? ' ' + cls : '');
  }
  var flashTimer = null;
  function flash(t){
    var d = document.getElementById('stxt');
    d.textContent = t;
    document.getElementById('dot').className = 'dot on';
    if(flashTimer) clearTimeout(flashTimer);
    flashTimer = setTimeout(function(){
      d.textContent = cli && cli.isConnected() ? '已连上，实时同步' : '没连上，先存在本机';
      document.getElementById('dot').className = 'dot ' + (cli && cli.isConnected() ? 'on' : 'off');
    }, 1200);
  }

  /* ---------- 连接 ---------- */
  function connect(){
    setSt('正在连上…','');
    cli = new MiniMQTT(BROKER, {
      clientId: 'kwsec-' + CID,
      keepalive: 45,
      clean: true
    });
    cli.onconnect = function(){
      window.__kwStats.connectAt = Date.now();
      setSt('已连上，实时同步','on');
      cli.subscribe(T_DOC, 0);
      cli.subscribe(T_WHO + '+', 0);
      cli.publish(T_WHO + CID, JSON.stringify({ n: ME || '我', online: true }), {retain:true});
      /* 只有「本机真被改过」才推 —— 否则会把对面已写好的内容盖成默认文本 */
      if(state && state.dirty) push(true, true);
    };
    cli.onmessage = onMessage;
    cli.onclose = function(){ setSt('掉线了，正在重连…','off'); };
    cli.onerror = function(){ setSt('没连上，先存在本机','off'); };
    cli.connect();
  }
  window.addEventListener('beforeunload', function(){
    try{ if(cli && cli.isConnected()) cli.publish(T_WHO + CID, '', {retain:true}); }catch(e){}
  });

  /* ---------- 启动 ---------- */
  state = loadLocal() || newDoc();
  render();
  connect();
  document.getElementById('add').addEventListener('click', function(){
    state.blocks.push({ id:'b'+Date.now().toString(36), t:'' });
    render(); scheduleSave();
    var last = document.querySelector('#list .card:last-child .ed');
    if(last) last.focus();
  });
  document.getElementById('push').addEventListener('click', function(){ push(false); });
})();
</script>
</body>
</html>
