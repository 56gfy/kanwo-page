<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF3F6">
<title>我们的小秘密</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(128% 76% at 50% 0%,#FFFDFE 0%,#FFF2F6 42%,#FBE1EA 100%);
  background-attachment:fixed;
  color:#4A2B38;
  font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  font-size:16px;
}
main{padding:calc(env(safe-area-inset-top,0px) + 30px) 16px
             calc(env(safe-area-inset-bottom,0px) + 56px);
  max-width:640px;margin:0 auto}

/* ---------- 抬头 ---------- */
.hd{text-align:center;margin-bottom:14px}
.to{margin:0 0 12px;font-size:12px;letter-spacing:.44em;text-indent:.44em;color:#D98BA6}
h1{margin:0;font-family:"Songti SC","STSong","SimSun",serif;
  font-size:clamp(26px,8vw,36px);line-height:1.26;font-weight:600;
  letter-spacing:.05em;color:#43202F}
h1 .sub{display:block;margin-top:8px;font-size:.54em;font-weight:400;
  letter-spacing:.18em;text-indent:.18em;color:#E0618F}
.rule{width:46px;height:1px;margin:18px auto 0;
  background:linear-gradient(90deg,transparent,#F2A8C4,transparent)}

/* ---------- 状态灯 ---------- */
.bar{display:flex;align-items:center;justify-content:center;gap:7px;
  margin:12px 0 6px;font-size:12.5px;color:#A98A97;letter-spacing:.04em}
.dot{width:7px;height:7px;border-radius:50%;background:#D8C7CE;flex:0 0 auto;
  transition:background .3s}
.dot.on{background:#6FBF8F}
.dot.off{background:#E3A9B6}

/* ---------- 气泡（像聊天） ---------- */
.chat{display:flex;flex-direction:column;gap:16px;margin:20px 0 6px}

.row{display:flex;flex-direction:column;max-width:88%}
/* 上面那个：潘潘，靠左 */
.row.p{align-items:flex-start;align-self:flex-start;margin-right:auto}
/* 下面那个：蒙蒙，靠右 */
.row.m{align-items:flex-end;align-self:flex-end;margin-left:auto}

.who{display:flex;align-items:center;gap:6px;
  font-size:13px;color:#B48497;letter-spacing:.06em;padding:0 4px;margin-bottom:5px}
.who svg{display:block;flex:0 0 auto}
.row.m .who{flex-direction:row-reverse}

.bub{position:relative;width:100%;
  background:#FFFBFC;border-radius:16px;
  padding:12px 14px 9px;
  box-shadow:0 12px 26px -18px rgba(176,88,120,.42),
             0 2px 7px -4px rgba(176,88,120,.16)}
/* 小尖角，做出对话感 */
.bub:before{content:"";position:absolute;top:-6px;width:12px;height:12px;
  background:#FFFBFC;transform:rotate(45deg);border-radius:2px}
.row.p .bub:before{left:20px}
.row.m .bub:before{right:20px;background:#FFEFF6}
.row.m .bub{background:#FFEFF6}

.ed{display:block;width:100%;min-height:30px;
  font-family:"Songti SC","STSong","SimSun",serif;
  font-size:17px;line-height:1.85;letter-spacing:.02em;color:#4A2B38;
  background:transparent;border:0;outline:0;padding:0;resize:none;
  overflow:hidden;word-break:break-word;caret-color:#E0618F}
.ed:focus{outline:0}

.meta{display:flex;align-items:center;gap:8px;justify-content:flex-end;
  min-height:16px;margin-top:4px;
  font-size:11.5px;color:#C4A4B1;letter-spacing:.03em}
.row.m .meta{justify-content:flex-start}

/* 对方正在输入 */
.typing{display:none;align-items:center;gap:4px;color:#D08BA6;font-size:11.5px}
.typing.live{display:inline-flex}
.tdot{width:4px;height:4px;border-radius:50%;background:#E29BB6;display:inline-block;
  animation:tp 1.25s infinite ease-in-out}
.tdot:nth-child(2){animation-delay:.18s}
.tdot:nth-child(3){animation-delay:.36s}
@keyframes tp{0%,60%,100%{opacity:.28;transform:translateY(0)}
              30%{opacity:1;transform:translateY(-2px)}}

/* ---------- 底部 ---------- */
.foot{text-align:center;font-size:11.5px;line-height:1.9;color:#BFA0AD;
  letter-spacing:.05em;font-family:"Songti SC","STSong",serif;margin:26px 0 0}
.foot .k{color:#E0618F}

/* 桌面上左右留点边距，别贴到屏幕边 */
@media (min-width:520px){ .row{max-width:74%} }

@media (prefers-reduced-motion:no-preference){
  .row{animation:up .45s ease both}
  .row.m{animation-delay:.07s}
  @keyframes up{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .tdot{animation:none}
  }
}
</style>
</head>
<body>
<main>
  <div class="hd">
    <p class="to">只给你一个人看</p>
    <h1>我们的小秘密<span class="sub">写下来，对面就看得见</span></h1>
    <div class="rule"></div>
  </div>

  <div class="bar">
    <i class="dot" id="dot"></i><span id="stxt">正在连上…</span>
  </div>

  <div class="chat">
    <!-- 潘潘：偏左 -->
    <div class="row p">
      <div class="who">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
             stroke="#C4799A" stroke-width="1.6" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="8" r="3.6"></circle>
          <path d="M4.6 20.2c0-3.8 3.3-6.1 7.4-6.1s7.4 2.3 7.4 6.1"></path>
        </svg>
        <span>潘潘</span>
      </div>
      <div class="bub">
        <textarea class="ed" id="in-p" rows="1" spellcheck="false"
                  aria-label="潘潘写的话"></textarea>
        <div class="meta">
          <span class="typing" id="typ-p">
            <i class="tdot"></i><i class="tdot"></i><i class="tdot"></i>
            <span>对方正在输入…</span>
          </span>
          <span id="time-p">刚刚</span>
        </div>
      </div>
    </div>

    <!-- 蒙蒙：偏右 -->
    <div class="row m">
      <div class="who">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
             stroke="#C4799A" stroke-width="1.6" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="8" r="3.6"></circle>
          <path d="M4.6 20.2c0-3.8 3.3-6.1 7.4-6.1s7.4 2.3 7.4 6.1"></path>
        </svg>
        <span>蒙蒙</span>
      </div>
      <div class="bub">
        <textarea class="ed" id="in-m" rows="1" spellcheck="false"
                  aria-label="蒙蒙写的话"></textarea>
        <div class="meta">
          <span class="typing" id="typ-m">
            <i class="tdot"></i><i class="tdot"></i><i class="tdot"></i>
            <span>对方正在输入…</span>
          </span>
          <span id="time-m">刚刚</span>
        </div>
      </div>
    </div>
  </div>

  <p class="foot">你那边改的，我这边也看得见<br>
    <span class="k">写下来，对面就看得见</span></p>
</main>

<script>
/* ==========================================================================
   MiniMQTT - 手写的最小 MQTT 3.1.1 over WebSocket 客户端（无任何外部依赖）
   只用到：CONNECT / PUBLISH / SUBSCRIBE / PINGREQ / DISCONNECT
   ========================================================================== */
(function(){
  var TE = new TextEncoder(), TD = new TextDecoder();
  function u16(n){ return [ (n>>8)&255, n&255 ]; }
  function len(n){ var o=[]; do { var d=n%128; n=Math.floor(n/128); if(n>0) d|=128; o.push(d); } while(n>0); return o; }
  function cat(){ var t=0,i; for(i=0;i<arguments.length;i++) t+=arguments[i].length;
    var o=new Uint8Array(t),p=0; for(i=0;i<arguments.length;i++){ o.set(arguments[i],p); p+=arguments[i].length; } return o; }
  function mstr(s){ var b=TE.encode(s); return cat(new Uint8Array(u16(b.length)), b); }
  function packet(type, flags, body){ var L=len(body.length);
    var h=new Uint8Array(1+L.length); h[0]=(type<<4)|flags; h.set(L,1); return cat(h, body); }

  function Mini(url, opts){
    var self=this;
    opts = opts || {};
    self.url=url; self.clientId=opts.clientId||('c'+Math.random().toString(36).slice(2,10));
    self.keepalive=opts.keepalive||45;
    self.will=opts.will||null;
    self.onopen=null; self.onconnect=null; self.onmessage=null;
    self.onclose=null; self.onerror=null; self.onsuback=null;
    self.connected=false; self.ended=false; self.reconnects=0;
    self.pid=0; self.buf=new Uint8Array(0); self.pingTimer=null; self.tries=0;

    function fail(msg){ if(self.onerror) self.onerror(msg); }

    function handle(b0, p){
      var type=b0>>4;
      if(type===2){                                  // CONNACK
        if(p.length<2) return;
        var rc=p[1];
        if(rc===0){
          self.connected=true; self.tries=0;
          self.pingTimer=setInterval(function(){ raw(packet(12,0,new Uint8Array(0))); }, self.keepalive*1000/2);
          if(self.onconnect) self.onconnect();
        } else { fail('CONNACK rc='+rc); self.close(); }
      } else if(type===3){                           // PUBLISH
        var qos=(b0>>1)&3, retain=(b0&1)===1;
        var tl=(p[0]<<8)|p[1]; var off=2+tl;
        if(p.length<off) return;
        var topic=TD.decode(p.subarray(2,off));
        if(qos>0) off+=2;
        var payload=TD.decode(p.subarray(off));
        if(self.onmessage) self.onmessage(topic, payload, retain);
      } else if(type===9){                           // SUBACK
        if(self.onsuback) self.onsuback(p);
      }
    }

    function onData(u8){
      var nb=new Uint8Array(self.buf.length+u8.length);
      nb.set(self.buf); nb.set(u8, self.buf.length); self.buf=nb;
      while(self.buf.length>=2){
        var i=1, mult=1, l=0, done=false;
        while(i<self.buf.length && i<=4){
          var d=self.buf[i]; l+=(d&127)*mult; mult*=128; i++;
          if((d&128)===0){ done=true; break; }
        }
        if(!done) return;
        if(self.buf.length < i+l) return;
        handle(self.buf[0], self.buf.slice(i, i+l));
        self.buf=self.buf.slice(i+l);
      }
    }

    var ws=null;
    function raw(bytes){ try{ if(ws && ws.readyState===1) ws.send(bytes); }catch(e){ fail(String(e)); } }

    self.connect=function(){
      if(self.ended) return;
      try{ ws=new WebSocket(self.url); }catch(e){ fail(String(e)); return; }
      ws.binaryType='arraybuffer';
      ws.onopen=function(){
        var flags = (1<<1);                                   // clean session
        var payload = mstr(self.clientId);
        if(self.will){ flags |= (1<<2)|(1<<5); payload = cat(payload, mstr(self.will.topic), TE.encode(self.will.payload||'')); }
        var vh = cat(mstr('MQTT'), new Uint8Array([4, flags]), new Uint8Array(u16(self.keepalive)));
        raw(packet(1, 0, cat(vh, payload)));
        if(self.onopen) self.onopen();
      };
      ws.onmessage=function(e){ onData(new Uint8Array(e.data)); };
      ws.onerror=function(){ fail('websocket error'); };
      ws.onclose=function(){
        self.connected=false;
        if(self.pingTimer){ clearInterval(self.pingTimer); self.pingTimer=null; }
        if(self.onclose) self.onclose();
        /* 指数退避：1.5s, 3s, 6s, …… 上限 30s，最多 8 次 */
        if(!self.ended && self.tries<8){
          self.tries++;
          var wait=Math.min(30000, 1500*Math.pow(2,self.tries-1));
          setTimeout(self.connect, wait);
        }
      };
    };

    self.subscribe=function(topic, qos){
      if(!self.connected) return false;
      self.pid++;
      raw(packet(8, 2, cat(new Uint8Array(u16(self.pid)), mstr(topic), new Uint8Array([qos||0]))));
      return true;
    };
    self.publish=function(topic, payload, opt){
      if(!self.connected) return false;
      opt=opt||{};
      raw(packet(3, opt.retain?1:0, cat(mstr(topic), TE.encode(payload==null?'':String(payload)))));
      return true;
    };
    self.close=function(){ self.ended=true;
      if(self.pingTimer){ clearInterval(self.pingTimer); self.pingTimer=null; }
      try{ raw(packet(14,0,new Uint8Array(0))); }catch(e){}
      try{ if(ws) ws.close(); }catch(e){}
      self.connected=false;
    };
    self.isConnected=function(){ return self.connected; };
  }
  window.MiniMQTT = Mini;
})();
</script>

<script>
/* ==========================================================================
   两个气泡，两条独立通道
     kws/sec/<ROOM>/p  对应 潘潘那个框
     kws/sec/<ROOM>/m  对应 蒙蒙那个框
   各自独立收发，互不干扰（不是两个人共用一份文档）
   ========================================================================== */
(function(){
  "use strict";

  var Q = (function(){ var o={},s=location.search.replace(/^\?/,''); if(s) s.split('&').forEach(function(kv){
      var a=kv.split('='); if(a[0]) o[decodeURIComponent(a[0])]=decodeURIComponent(a[1]||''); }); return o; })();
  var ROOM = ((Q.get ? Q.get('r') : Q['r']) || '').replace(/[^A-Za-z0-9_-]/g,'').slice(0,32) || 'womens-own-secret';
  var BROKER = 'wss://broker.hivemq.com:8884/mqtt';
  var CID = 'c' + Math.random().toString(36).slice(2,10);

  /* 两个通道的定义：谁、哪个输入框、哪个主题、本机存储键 */
  var CHANNELS = [
    { key:'p', name:'潘潘', topic:'kws/sec/'+ROOM+'/p', tip:'kws/sec/'+ROOM+'/ptyp',
      init:'潘潘', input:'in-p', time:'time-p', typing:'typ-p', store:'kwsec_'+ROOM+'_p' },
    { key:'m', name:'蒙蒙', topic:'kws/sec/'+ROOM+'/m', tip:'kws/sec/'+ROOM+'/mtyp',
      init:'蒙蒙', input:'in-m', time:'time-m', typing:'typ-m', store:'kwsec_'+ROOM+'_m' }
  ];

  /* 每个通道的运行时状态 */
  var chState = {};
  CHANNELS.forEach(function(c){
    chState[c.key] = { text:'', ts:0, typing:false, pending:null, sendTimer:null,
                       typingTimer:null, els:{}, _selfWrite:false };
  });

  var cli = null;
  var stats = { connectAt:0, pubOK:0, pubSkipNoConn:0, recv:0, recvOwnEcho:0,
                recvDeferred:0, typingEvt:0, chans:{} };
  CHANNELS.forEach(function(c){ stats.chans[c.key] = { sent:0, got:0 }; });
  window.__kwStats = stats;

  /* ---------- 本地兜底 ---------- */
  function loadLocal(c){
    try{ var s = localStorage.getItem(c.store); if(s){ var d = JSON.parse(s);
      if(d && typeof d.t === 'string'){ return { t:d.t, ts:d.ts||0 }; } } }catch(e){}
    return null;
  }
  function persist(c){
    var st = chState[c.key];
    try{ localStorage.setItem(c.store, JSON.stringify({ t:st.text, ts:st.ts })); }catch(e){}
  }

  /* ---------- 相对时间 ---------- */
  function rel(ts){
    if(!ts) return '';
    var s = Math.floor((Date.now() - ts) / 1000);
    if(s < 0) s = 0;
    if(s < 45) return '刚刚';
    if(s < 3600) return Math.floor(s/60) + ' 分钟前';
    if(s < 86400) return Math.floor(s/3600) + ' 小时前';
    if(s < 86400*30) return Math.floor(s/86400) + ' 天前';
    var d = new Date(ts);
    return (d.getMonth()+1) + ' 月 ' + d.getDate() + ' 日';
  }
  function paintTimes(){
    CHANNELS.forEach(function(c){
      var st = chState[c.key];
      var el = st.els.time;
      if(!el) return;
      el.textContent = st.ts ? rel(st.ts) : '还没写过';
    });
  }
  setInterval(paintTimes, 20000);

  /* ---------- 输入框自动长高（不出内部滚动条） ---------- */
  function autoGrow(el){
    el.style.height = 'auto';
    var v = el.scrollHeight || 0;
    el.style.height = Math.max(30, v) + 'px';
  }
  window.__kwAutoGrow = autoGrow;

  /* ---------- 发送 ---------- */
  function publishChan(c){
    var st = chState[c.key];
    st.ts = Date.now();
    persist(c);
    var out = { t: st.text, ts: st.ts, n: c.name, cid: CID };
    if(cli && cli.isConnected()){
      cli.publish(c.topic, JSON.stringify(out), { retain:true });
      stats.pubOK++; stats.chans[c.key].sent++;
    } else {
      /* 没连上 = 这次改动只有本机知道，先存着，连上后 onconnect 会补推 */
      stats.pubSkipNoConn++;
    }
    paintTimes();
  }
  function scheduleSend(c){
    var st = chState[c.key];
    if(st.sendTimer) clearTimeout(st.sendTimer);
    st.sendTimer = setTimeout(function(){ st.sendTimer = null; publishChan(c); }, 220);
  }

  /* ---------- 对方正在输入… ---------- */
  function sendTyping(c){
    if(!cli || !cli.isConnected()) return;
    cli.publish(c.tip, JSON.stringify({ on:true, cid: CID, n: c.name }), {});
  }

  /* ---------- 应用一条远端消息 ---------- */
  function applyRemote(c, d){
    var st = chState[c.key];
    if(st.typing){
      /* 正在打字：先攒着，绝不覆盖（否则光标被抢、输入被打断） */
      st.pending = { t: (d.t == null ? '' : String(d.t)), ts: d.ts || Date.now() };
      stats.recvDeferred++; stats.chans[c.key].got++;
      return;
    }
    st.text = (d.t == null ? '' : String(d.t));
    st.ts = d.ts || Date.now();
    st._selfWrite = true;
    st.els.in.value = st.text;
    autoGrow(st.els.in);
    st._selfWrite = false;
    persist(c);
    paintTimes();
    stats.chans[c.key].got++;
  }

  /* ---------- 收到消息 ---------- */
  function onMessage(topic, payload){
    var c = null, i;
    for(i=0;i<CHANNELS.length;i++){ if(CHANNELS[i].topic === topic){ c = CHANNELS[i]; break; } }
    if(c){
      var d;
      try{ d = JSON.parse(payload); }catch(e){ return; }
      if(!d) return;
      /* 自己发的会被 broker 投回来，按 cid 丢弃，否则会把自己当对面 */
      if(d.cid && d.cid === CID){ stats.recvOwnEcho++; return; }
      stats.recv++;
      applyRemote(c, d);
      return;
    }
    /* typing 事件 */
    for(i=0;i<CHANNELS.length;i++){
      if(CHANNELS[i].tip === topic){
        var t; try{ t = JSON.parse(payload); }catch(e){ return; }
        if(!t || t.cid === CID) return;
        var st = chState[CHANNELS[i].key];
        var el = st.els.typing;
        if(t.on){
          if(el) el.classList.add('live');
          stats.typingEvt++;
          if(st.typingTimer) clearTimeout(st.typingTimer);
          st.typingTimer = setTimeout(function(){ if(el) el.classList.remove('live'); }, 3000);
        } else {
          if(st.typingTimer) clearTimeout(st.typingTimer);
          if(el) el.classList.remove('live');
        }
        return;
      }
    }
  }

  /* ---------- 状态灯 ---------- */
  function setSt(txt, cls){
    document.getElementById('stxt').textContent = txt;
    document.getElementById('dot').className = 'dot' + (cls ? ' ' + cls : '');
  }

  /* ---------- 接线 ---------- */
  function wire(){
    CHANNELS.forEach(function(c){
      var st = chState[c.key];
      var el = document.getElementById(c.input);
      st.els.in = el;
      st.els.time = document.getElementById(c.time);
      st.els.typing = document.getElementById(c.typing);

      /* 初始文字：本机存档优先，其次初始文字 */
      var loc = loadLocal(c);
      st.text = loc ? loc.t : c.init;
      st.ts   = loc ? loc.ts : 0;
      st._selfWrite = true;
      el.value = st.text;
      st._selfWrite = false;
      autoGrow(el);

      el.addEventListener('input', function(){
        if(st._selfWrite) return;              /* 程序写入不触发发送 */
        st.text = el.value;
        st.ts = Date.now();
        autoGrow(el);
        persist(c); paintTimes();
        scheduleSend(c);
        sendTyping(c);
      });
      el.addEventListener('focus', function(){ st.typing = true; });
      el.addEventListener('blur', function(){
        st.typing = false;
        /* 失焦后把攒着的远端改动并进来 —— 本机已在打字期间发过，这边直接采纳对面最新的 */
        if(st.pending){ var p = st.pending; st.pending = null;
          applyRemote(c, { t: p.t, ts: p.ts });
        }
      });
      window.addEventListener('resize', function(){ autoGrow(el); });
    });
    paintTimes();

    /* 退出前告诉对面「我不打字了」（typing 是瞬时事件，避免残留） */
    window.addEventListener('beforeunload', function(){
      try{ if(cli && cli.isConnected()){
        CHANNELS.forEach(function(c){ cli.publish(c.tip, JSON.stringify({ on:false, cid: CID }), {}); });
      } }catch(e){}
    });
  }

  /* ---------- 连接 ---------- */
  function connect(){
    setSt('正在连上…','');
    cli = new MiniMQTT(BROKER, {
      clientId: 'kwsec-' + CID,
      keepalive: 45,
      clean: true
    });
    cli.onconnect = function(){
      stats.connectAt = Date.now();
      setSt('已连上实时同步','on');
      CHANNELS.forEach(function(c){
        cli.subscribe(c.topic, 0);
        cli.subscribe(c.tip, 0);
      });
      /* 连上后把两个框的本机内容都推一次：既是补推离线改动，
         也保证新来的一方能立刻看到对方已有的字（retain 主题） */
      CHANNELS.forEach(function(c){ publishChan(c); });
    };
    cli.onmessage = onMessage;
    cli.onclose = function(){ setSt('掉线正在重连…','off'); };
    cli.onerror = function(){ setSt('没连上，先存在本机','off'); };
    cli.connect();
  }

  /* ---------- 启动 ---------- */
  wire();
  connect();
})();
</script>
</body>
</html>
