<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAF6EF">
<title>我们的故事</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(130% 80% at 50% 0%,#FFFDF9 0%,#FAF6EF 46%,#F4EEE3 100%);
  background-attachment:fixed;
  color:#2A2622;
  font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
main{
  padding:calc(env(safe-area-inset-top,0px) + 34px) 22px
          calc(env(safe-area-inset-bottom,0px) + 46px);
  max-width:600px;margin:0 auto;
}

/* ---------- 头 ---------- */
.hd{text-align:center;margin-bottom:36px}
.to{
  margin:0 0 16px;font-size:12px;letter-spacing:.42em;
  text-indent:.42em;color:#BC9C60;
}
h1{
  margin:0;font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
  font-size:clamp(30px,9.2vw,42px);line-height:1.25;font-weight:600;
  letter-spacing:.05em;color:#241F1B;
}
h1 .sub{
  display:block;margin-top:8px;font-size:.6em;font-weight:400;
  letter-spacing:.2em;text-indent:.2em;color:#B23A2E;
}
.rule{
  width:46px;height:1px;margin:26px auto 0;
  background:linear-gradient(90deg,transparent,#C9A75F,transparent);
}

/* ---------- 引言 ---------- */
.lead{margin:32px 0 44px;text-align:center}
.lead p{
  margin:0 0 14px;font-size:14px;line-height:2.05;letter-spacing:.045em;
  color:#6E6255;font-family:"Songti SC","STSong","SimSun",serif;
}
.lead p:last-child{margin-bottom:0}
.lead .soft{color:#9C9082;font-size:13px}

/* ---------- 照片墙 ---------- */
.wall{display:block}
.wrap{margin:0 0 36px;position:relative}
.wrap:last-child{margin-bottom:0}

/* 相纸：照片四周留白，别铺满屏 */
.shot{
  position:relative;margin:0;background:#FFFEFB;
  padding:8px 8px 27px;border-radius:1px;
  box-shadow:0 13px 30px -15px rgba(74,50,26,.42),
             0 3px 9px -5px rgba(74,50,26,.16);
}
/* 内裁切：缩放只发生在照片里，不动相纸 */
.ph{
  position:relative;overflow:hidden;border-radius:1px;
  background:#EFE8DC;width:100%;
}
.ph img{
  display:block;width:100%;height:100%;object-fit:cover;
  transform-origin:center;
  animation:kb 21s ease-in-out infinite alternate;
  will-change:transform;
}
/* 每张的游走方向/节奏都不同 —— 整页看过去是「活的」，不是整齐划一 */
.wrap:nth-child(4n+1) .ph img{animation-duration:19s;transform-origin:38% 44%}
.wrap:nth-child(4n+2) .ph img{animation-duration:24s;animation-direction:alternate-reverse;
  transform-origin:62% 56%}
.wrap:nth-child(4n+3) .ph img{animation-duration:22s;transform-origin:50% 62%}
.wrap:nth-child(4n+4) .ph img{animation-duration:26s;animation-direction:alternate-reverse;
  transform-origin:44% 38%}
@keyframes kb{
  from{transform:scale(1.02) translate3d(0,0,0)}
  to{transform:scale(1.09) translate3d(0,-5px,0)}
}
/* 相纸反光：偶尔慢慢掠过一次 */
.ph::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(104deg,transparent 38%,rgba(255,255,255,.40) 50%,transparent 62%);
  transform:translateX(-118%);
  animation:sheen 7.5s ease-in-out infinite;
}
.wrap:nth-child(3n+2) .ph::after{animation-delay:2.4s}
.wrap:nth-child(3n) .ph::after{animation-delay:4.6s}
.duo .wrap:nth-child(2) .ph::after{animation-delay:1.3s}
@keyframes sheen{
  0%{transform:translateX(-118%)}
  44%,100%{transform:translateX(118%)}
}

.no{
  position:absolute;left:10px;right:10px;bottom:8px;
  font-size:9.5px;line-height:1;letter-spacing:.26em;
  color:#C6A96D;text-align:right;
  font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
.rot-l{rotate:-1.15deg}
.rot-r{rotate:.95deg}
.rot-s{rotate:-.55deg}

/* 配文 */
.cap{
  margin:14px 4px 0;font-size:13px;line-height:1.95;letter-spacing:.035em;
  color:#7A6E60;text-align:center;
  font-family:"Songti SC","STSong","SimSun",serif;
}
.cap b{color:#B23A2E;font-weight:600}

/* 单图：收窄，别让脸糊满屏 */
.solo{max-width:80%;margin-left:auto;margin-right:auto}
.solo-narrow{max-width:70%;margin-left:auto;margin-right:auto}

/* 双图并排 */
.duo{display:flex;gap:13px;align-items:flex-start}
.duo .wrap{flex:1 1 0;min-width:0;margin-bottom:0}
.duo .shot{padding:6px 6px 25px}
.duo .ph{aspect-ratio:3/4}
.duo .no{left:8px;right:8px;bottom:7px;font-size:8.5px;letter-spacing:.2em}
.duo .cap{margin-top:13px;font-size:12.5px;line-height:1.85}

/* ---------- 尾 ---------- */
.ft{text-align:center;margin-top:46px}
.ft .line{
  width:92px;height:1px;margin:0 auto 26px;
  background:linear-gradient(90deg,transparent,#DCC9A6,transparent);
}
.ft .end{
  margin:0 0 26px;font-size:14px;line-height:2.05;letter-spacing:.05em;
  color:#6E6255;font-family:"Songti SC","STSong","SimSun",serif;
}
.seal{
  display:inline-block;width:30px;height:30px;line-height:30px;
  background:#B23A2E;color:#FFF6F2;border-radius:2px;
  font-family:"Songti SC","STSong","SimSun",serif;
  font-size:15px;letter-spacing:0;text-align:center;
  box-shadow:0 4px 12px -6px rgba(178,58,46,.7);
}
.date{
  margin:14px 0 0;font-size:11px;letter-spacing:.3em;
  text-indent:.3em;color:#A79C8B;
  font-family:"Songti SC","STSong","SimSun",serif;
}

/* ---------- 入场（脚本可用时才启用）---------- */
.js .hd,.js .lead,.js .wrap,.js .ft{opacity:0;transform:translateY(20px)}
.js .wrap{transform:translateY(20px) scale(.985)}
.js .in{
  opacity:1;
  transition:opacity .85s ease,transform .85s cubic-bezier(.22,.7,.24,1);
  transform:translateY(0) scale(1);
}
@media (prefers-reduced-motion:reduce){
  .js .hd,.js .lead,.js .wrap,.js .ft,.js .in{opacity:1;transform:none;transition:none}
  .ph img,.ph::after{animation:none}
}
</style>
</head>
<body>

<main>
  <header class="hd">
    <p class="to">小蒙</p>
    <h1>我们的故事<span class="sub">才刚刚开始</span></h1>
    <div class="rule"></div>
  </header>

  <section class="lead">
    <p>把这些日子一张一张收好，<br>像把喜欢叠进抽屉里。</p>
    <p>没有什么惊天动地的大事，<br>都是些很小、很亮的瞬间。</p>
    <p class="soft">每一次回头看你，<br>都觉得还没看够。</p>
  </section>

  <section class="wall">

    <div class="wrap rot-l solo">
      <figure class="shot">
        <div class="ph" style="aspect-ratio:560/996">
          <img src="photos/p1.jpg" alt="" width="560" height="996">
        </div>
        <figcaption class="no">01</figcaption>
      </figure>
      <p class="cap">那天你把猫耳朵戴在头上，<br>笑得像偷到了整罐的糖。</p>
    </div>

    <div class="duo">
      <div class="wrap rot-s">
        <figure class="shot">
          <div class="ph">
            <img src="photos/p2.jpg" alt="" width="560" height="996" loading="lazy">
          </div>
          <figcaption class="no">02</figcaption>
        </figure>
        <p class="cap">你说拍一张好看的。</p>
      </div>
      <div class="wrap rot-r">
        <figure class="shot">
          <div class="ph">
            <img src="photos/p6.jpg" alt="" width="560" height="1233" loading="lazy">
          </div>
          <figcaption class="no">03</figcaption>
        </figure>
        <p class="cap">比个 V，天就亮了。</p>
      </div>
    </div>

    <div class="duo" style="margin-top:36px">
      <div class="wrap rot-l">
        <figure class="shot">
          <div class="ph">
            <img src="photos/p3.jpg" alt="" width="560" height="747" loading="lazy">
          </div>
          <figcaption class="no">04</figcaption>
        </figure>
        <p class="cap">两杯冰饮，<br>一杯是你的。</p>
      </div>
      <div class="wrap rot-s">
        <figure class="shot">
          <div class="ph">
            <img src="photos/p4.jpg" alt="" width="560" height="747" loading="lazy">
          </div>
          <figcaption class="no">05</figcaption>
        </figure>
        <p class="cap">另一杯，<br>是陪我坐着的。</p>
      </div>
    </div>

    <div class="wrap rot-r solo-narrow" style="margin-top:36px">
      <figure class="shot">
        <div class="ph" style="aspect-ratio:560/873">
          <img src="photos/p5.jpg" alt="" width="560" height="873" loading="lazy">
        </div>
        <figcaption class="no">06</figcaption>
      </figure>
      <p class="cap">后座那只小家伙抢了镜，<br><b>你回头喊我看。</b></p>
    </div>

  </section>

  <footer class="ft">
    <div class="line"></div>
    <p class="end">往后的日子还很长，<br>我想慢慢陪你走完。</p>
    <span class="seal">蒙</span>
    <p class="date">二〇二六年九月</p>
  </footer>
</main>

<script>
/* 入场动画：脚本可用才启用，且【绝不允许内容永久停在看不见】。
   IntersectionObserver 快速滑动会整段漏触发 → 挂 scroll 兜底 + 定时强揭。 */
(function(){
  var root=document.documentElement;
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    return;
  }
  root.classList.add('js');
  var nodes=[].slice.call(document.querySelectorAll('.hd,.lead,.wrap,.ft'));
  var pending=nodes.slice();

  function sweep(final){
    if(!pending.length) return;
    var limit=window.innerHeight*1.02;
    for(var i=pending.length-1;i>=0;i--){
      var el=pending[i];
      if(final||el.getBoundingClientRect().top<=limit){
        el.classList.add('in');
        pending.splice(i,1);
      }
    }
  }

  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){
      es.forEach(function(e){
        if(!e.isIntersecting) return;
        e.target.classList.add('in');
        var i=pending.indexOf(e.target);
        if(i>=0) pending.splice(i,1);
        io.unobserve(e.target);
      });
    },{rootMargin:'0px 0px -8% 0px',threshold:.06});
    nodes.forEach(function(n){io.observe(n);});
  } else {
    sweep(true);
  }

  window.addEventListener('scroll',function(){sweep(false);},{passive:true});
  window.addEventListener('resize',function(){sweep(false);},{passive:true});
  window.addEventListener('load',function(){sweep(false);});
  setTimeout(function(){sweep(true);},2400);
  sweep(false);
})();
</script>
</body>
</html>
