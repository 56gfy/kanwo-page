<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF3F6">
<title>我们的小秘密</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(128% 76% at 50% 0%,#FFFDFE 0%,#FFF2F6 42%,#FBE1EA 100%);
  background-attachment:fixed;
  color:#4A2B38;
  font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  font-size:16px;
}
main{position:relative;z-index:1;
  padding:calc(env(safe-area-inset-top,0px) + 30px) 16px
             calc(env(safe-area-inset-bottom,0px) + 30px);
  max-width:640px;margin:0 auto;
  min-height:100vh;
  min-height:100svh;
  min-height:100dvh;
  display:flex;flex-direction:column}

/* ---------- 抬头 ---------- */
.hd{text-align:center;margin-bottom:14px}
.to{margin:0 0 12px;font-size:12px;letter-spacing:.44em;text-indent:.44em;color:#D98BA6}
h1{margin:0;font-family:"Songti SC","STSong","SimSun",serif;
  font-size:clamp(26px,8vw,36px);line-height:1.26;font-weight:600;
  letter-spacing:.05em;color:#43202F}
h1 .sub{display:block;margin-top:8px;font-size:.54em;font-weight:400;
  letter-spacing:.18em;text-indent:.18em;color:#E0618F}
.rule{width:46px;height:1px;margin:18px auto 0;
  background:linear-gradient(90deg,transparent,#F2A8C4,transparent)}

/* ---------- 「来过」提示（标题下、聊天上，居中一行小字） ----------
   对方没来过 = 不显示、不占位（常态 display:none，是真的不渲染）。
   来了才淡入，收到后 1.8 秒自己淡掉，不做常驻占位。
   字号比正文小、颜色比时间还淡，绝不抢戏。 */
.pv{display:none;margin:2px auto 0;text-align:center;
  font-size:11.5px;line-height:1.6;letter-spacing:.06em;color:#D3AEBD;
  opacity:0;transition:opacity .5s ease}
.pv.show{display:block;opacity:1}
.pv.fade{opacity:0}

/* ---------- 状态提示（隐形：常态完全不占位、不可见） ----------
   连上 = 什么都不显示；只有真掉线时才浮出来。定位是 fixed，
   绝不参与文档流，所以气泡永远不会被推上推下。
   常态 display:none —— 是真的不渲染、不占位，不是「变淡」；
   异常时加 .show 切成 flex 淡入，恢复连上就切回 none 自动消失。 */
.notice{display:none;position:fixed;left:50%;z-index:40;
  bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  align-items:center;
  padding:7px 15px;border-radius:999px;
  font-size:12.5px;letter-spacing:.03em;white-space:nowrap;
  color:#B4738D;background:rgba(255,248,251,.96);
  box-shadow:0 10px 22px -14px rgba(176,88,120,.5),
             0 2px 8px -5px rgba(176,88,120,.22);
  opacity:0;pointer-events:none;
  transform:translate(-50%,10px);
  transition:opacity .34s ease,transform .34s ease}
.notice.show{display:flex;opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.notice-btn{margin-left:11px;border:0;outline:0;padding:0 0 0 11px;
  background:transparent;color:#E0618F;font-family:inherit;
  font-size:12.5px;letter-spacing:.03em;cursor:pointer;
  border-left:1px solid #F0CFDD}

/* ---------- 同步小绿灯（右上角常驻，极小，不挡任何内容） ----------
   三态：淡灰 = 首次连接中；绿 = 已连上、同步正常；红 = 连不上 / 掉线。
   固定定位画在屏幕右上角，完全不参与文档流，绝不压到标题、气泡或输入框。
   safe-area 兜底：刘海 / 圆角屏上自动往里收，不会被切掉。 */
.sync-dot{position:fixed;z-index:45;display:block;
  top:calc(env(safe-area-inset-top,0px) + 14px);
  right:calc(env(safe-area-inset-right,0px) + 14px);
  width:9px;height:9px;border-radius:50%;
  background:#DCD3D7;cursor:default;
  box-shadow:0 0 0 3px rgba(220,211,215,.20);
  transition:background .28s ease,box-shadow .28s ease}
.sync-dot.ok{background:#43C463;cursor:default;
  box-shadow:0 0 0 3px rgba(67,196,99,.20),0 0 8px 1px rgba(67,196,99,.45)}
.sync-dot.bad{background:#E45B7B;cursor:pointer;
  box-shadow:0 0 0 3px rgba(228,91,123,.20),0 0 8px 1px rgba(228,91,123,.45)}

/* ---------- 气泡（像聊天） ---------- */
.chat{display:flex;flex-direction:column;gap:16px;margin:20px 0 6px}

.row{display:flex;flex-direction:column;max-width:88%}
/* 上面那个：潘潘，靠左 */
.row.p{align-items:flex-start;align-self:flex-start;margin-right:auto}
/* 下面那个：萌萌，靠右 */
.row.m{align-items:flex-end;align-self:flex-end;margin-left:auto}

.who{display:flex;align-items:center;gap:6px;
  font-size:13px;color:#B48497;letter-spacing:.06em;padding:0 4px;margin-bottom:5px}
.ava-w{width:34px;height:34px;border-radius:50%;flex:0 0 auto;display:block;
  overflow:hidden;background:#F7E3EC;
  box-shadow:0 0 0 2px #FFF,0 0 0 3.5px #F3CBDC,0 2px 6px rgba(224,97,143,.14)}
.ava{width:100%;height:100%;display:block;object-fit:cover}
.who svg{display:block;flex:0 0 auto}
.row.m .who{flex-direction:row-reverse}

.bub{position:relative;width:100%;
  background:#FFFBFC;border-radius:16px;
  padding:12px 14px 9px;
  box-shadow:0 12px 26px -18px rgba(176,88,120,.42),
             0 2px 7px -4px rgba(176,88,120,.16)}
/* 小尖角，做出对话感 */
.bub:before{content:"";position:absolute;top:-6px;width:12px;height:12px;
  background:#FFFBFC;transform:rotate(45deg);border-radius:2px}
.row.p .bub:before{left:20px}
.row.m .bub:before{right:20px;background:#FFEFF6}
.row.m .bub{background:#FFEFF6}

/* 触摸友好：最小高度 44px（拇指也能稳稳点中），内容多了再自己长高。
   内边距给一点上下的余量，让 44px 是靠真实内容撑起来的，不是靠 min-height 硬顶。 */
.ed{display:block;width:100%;min-height:44px;
  font-family:"Songti SC","STSong","SimSun",serif;
  font-size:17px;line-height:1.85;letter-spacing:.02em;color:#4A2B38;
  background:transparent;border:0;outline:0;padding:3px 0;resize:none;
  overflow:hidden;word-break:break-word;caret-color:#E0618F}
.ed:focus{outline:0}
/* 提示文字：比正文浅、比时间淡，一打字就消失（textarea placeholder 默认行为） */
.ed::placeholder{color:#D9C2CC;font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14.5px;letter-spacing:.04em;opacity:1}

.meta{display:flex;align-items:center;gap:8px;justify-content:flex-end;
  min-height:16px;margin-top:4px;
  font-size:11.5px;color:#C4A4B1;letter-spacing:.03em}
.row.m .meta{justify-content:flex-start}

/* ---------- 送达回执（气泡右下角，紧挨时间） ----------
   比时间还小一号、还淡一档，低头一瞄看得到、抬头就忘。
   默认 display:none —— 发送中什么都不显示（不闪）；
   成功=「已送到」，没连上=「待发送」；一改动就清空回无。 */
.st{display:none;font-size:10px;letter-spacing:.04em;color:#DDC8D1}
.st.on{display:inline}

/* 对方正在输入 */
.typing{display:none;align-items:center;gap:4px;color:#D08BA6;font-size:11.5px}
.typing.live{display:inline-flex}
.tdot{width:4px;height:4px;border-radius:50%;background:#E29BB6;display:inline-block;
  animation:tp 1.25s infinite ease-in-out}
.tdot:nth-child(2){animation-delay:.18s}
.tdot:nth-child(3){animation-delay:.36s}
@keyframes tp{0%,60%,100%{opacity:.28;transform:translateY(0)}
              30%{opacity:1;transform:translateY(-2px)}}

/* ---------- 气泡下方的装饰分隔：细线 + 中央小符号 ---------- */
.div{display:flex;align-items:center;justify-content:center;gap:12px;
  margin:30px 0 0}
.div i{display:block;width:clamp(22px,20%,74px);height:1px;flex:0 0 auto;
  background:linear-gradient(90deg,transparent,#F3BCD0)}
.div i:last-child{background:linear-gradient(90deg,#F3BCD0,transparent)}
.div svg{display:block;flex:0 0 auto;opacity:.92}

/* ---------- 底部：撑满余量 + 落款式页脚 ---------- */
/* 中部装饰带：顶上气泡、下接页脚，把中间的空白填住 */
.mid{flex:1 1 auto;min-height:132px;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:10px 0 4px;gap:10px}
.mid-vine{width:74px;height:100%;max-height:230px;min-height:96px;
  flex:0 1 auto;display:block;opacity:.9}
.mid-line{margin:0;font-size:11px;letter-spacing:.42em;text-indent:.42em;
  color:#D3AEBD;font-family:"Songti SC","STSong",serif}

.foot{position:relative;text-align:center;margin:0}
.fx{display:block;margin:0 auto 14px;opacity:.9}
.foot p{margin:0;font-size:11.5px;line-height:1.95;color:#BFA0AD;
  letter-spacing:.06em;font-family:"Songti SC","STSong",serif}
.foot .k{color:#E0618F}
.foot .dt{margin-top:4px;font-size:11px;color:#CDAEB9;letter-spacing:.16em}
.wave{display:block;margin:22px auto 0}
/* 收尾：极淡的粉晕（画在角落，不在流里） */
.end{position:absolute;left:50%;top:calc(100% - 6px);
  width:min(300px,82vw);height:110px;
  transform:translateX(-50%);pointer-events:none;
  background:radial-gradient(closest-side,rgba(224,97,143,.075),rgba(224,97,143,0) 100%)}

/* 背景装饰：极淡，透明度压到 .06 以下，绝不上桌抢内容 */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg span{position:absolute;display:block;opacity:.06}
.bg .moon{left:-12%;top:-6%;width:min(300px,72vw)}
.bg .bloom{right:-16%;bottom:-8%;width:min(320px,78vw)}
.bg .star{left:7%;bottom:12%;width:62px;opacity:.06}

/* 桌面上左右留点边距，别贴到屏幕边 */
@media (min-width:520px){ .row{max-width:74%} }

@media (prefers-reduced-motion:no-preference){
  .row{animation:up .45s ease both}
  .row.m{animation-delay:.07s}
  @keyframes up{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .tdot{animation:none}
  }
}
</style>
</head>
<body>
<main>
  <!-- 右上角同步小绿灯：滴一声都不出，只用一个点的颜色说话 -->
  <span class="sync-dot" id="sync-dot" role="status" aria-live="polite"
        aria-label="正在连接" title="正在连接"></span>

  <div class="hd">
    <p class="to">只给你一个人看</p>
    <h1>我们的小秘密<span class="sub">写下来，对面就看得见</span></h1>
    <div class="rule"></div>
  </div>

  <!-- 「来过」提示：常态不显示、不占位；对方打开这一页时才浮出一下 -->
  <p class="pv" id="pv" role="status" aria-live="polite"></p>

  <div class="notice" id="notice" role="status" aria-live="polite">
    <span id="stxt"></span><button class="notice-btn" id="rtry" type="button">重试</button>
  </div>

  <div class="chat">
    <!-- 潘潘：偏左 -->
    <div class="row p">
      <div class="who">
        <span class="ava-w"><img class="ava" src="avatars/panpan.jpg" alt=""
                width="34" height="34" loading="eager" decoding="async"></span>
        <span>潘潘</span>
      </div>
      <div class="bub">
        <textarea class="ed" id="in-p" rows="1" spellcheck="false"
                  placeholder="想跟萌萌说什么…" aria-label="潘潘写的话"></textarea>
        <div class="meta">
          <span class="typing" id="typ-p">
            <i class="tdot"></i><i class="tdot"></i><i class="tdot"></i>
            <span>对方正在输入…</span>
          </span>
          <span class="st" id="st-p"></span>
          <span id="time-p">刚刚</span>
        </div>
      </div>
    </div>

    <!-- 萌萌：偏右 -->
    <div class="row m">
      <div class="who">
        <span class="ava-w"><img class="ava" src="avatars/mengmeng.jpg" alt=""
                width="34" height="34" loading="eager" decoding="async"></span>
        <span>萌萌</span>
      </div>
      <div class="bub">
        <textarea class="ed" id="in-m" rows="1" spellcheck="false"
                  placeholder="想跟潘潘说什么…" aria-label="萌萌写的话"></textarea>
        <div class="meta">
          <span class="typing" id="typ-m">
            <i class="tdot"></i><i class="tdot"></i><i class="tdot"></i>
            <span>对方正在输入…</span>
          </span>
          <span class="st" id="st-m"></span>
          <span id="time-m">刚刚</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 分隔：细线 + 中央小符号 -->
  <div class="div" aria-hidden="true">
    <i></i>
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
         stroke="#E39DB8" stroke-width="1.4" stroke-linecap="round">
      <path d="M12 7.4c1.5-2.4 6.1-1.5 6.1 1.8 0 2.4-2.9 3.9-6.1 6.6-3.2-2.7-6.1-4.2-6.1-6.6 0-3.3 4.6-4.2 6.1-1.8Z"></path>
    </svg>
    <i></i>
  </div>

  <!-- 中部装饰带：填住气泡与页脚之间的大片空白（纯装饰，不参与交互） -->
  <div class="mid" aria-hidden="true">
    <svg class="mid-vine" viewBox="0 0 120 220" width="100%" height="100%" fill="none">
      <path d="M60 6c-16 26-16 44 0 64s16 40 0 64-16 44 0 62"
            stroke="#EFC3D5" stroke-width="1.1" stroke-linecap="round" opacity=".72"></path>
      <path d="M60 70c-9-3-16-10-19-19 10 0 17 5 19 19Z" fill="#F5CBDB" opacity=".62"></path>
      <path d="M60 70c9-3 16-10 19-19-10 0-17 5-19 19Z" fill="#F2BED2" opacity=".55"></path>
      <path d="M60 158c-9-3-16-10-19-19 10 0 17 5 19 19Z" fill="#F2BED2" opacity=".55"></path>
      <path d="M60 158c9-3 16-10 19-19-10 0-17 5-19 19Z" fill="#F5CBDB" opacity=".62"></path>
      <circle cx="60" cy="6" r="2.4" fill="#E9A6C1" opacity=".8"></circle>
      <circle cx="60" cy="196" r="2.4" fill="#E9A6C1" opacity=".8"></circle>
      <circle cx="60" cy="110" r="3.1" fill="#EE9DBE" opacity=".5"></circle>
    </svg>
    <p class="mid-line">写给以后</p>
  </div>

  <footer class="foot">
    <svg class="fx" width="42" height="19" viewBox="0 0 42 19" fill="none"
         stroke="#EAACC5" stroke-width="1.2" aria-hidden="true">
      <path d="M21 3.4c-1.5-2.1-5.4-1-5.4 1.7 0 2.1 2.7 3.5 5.4 5.6 2.7-2.1 5.4-3.5 5.4-5.6 0-2.7-3.9-3.8-5.4-1.7Z"></path>
      <path d="M21 14.6 4 14.6M21 14.6 38 14.6" stroke-linecap="round" opacity=".5"></path>
    </svg>
    <p>你那边改的，我这边也看得见<br>
      <span class="k">写下来，对面就看得见</span></p>
    <p class="dt" id="today">给我们的第 1 天</p>
    <svg class="wave" width="86" height="12" viewBox="0 0 86 12" fill="none"
         aria-hidden="true">
      <path d="M3 8.5c6-6 12-6 18 0s12 6 18 0 12-6 18 0 12 6 18 0" stroke="#F0C9D8"
            stroke-width="1.2" stroke-linecap="round" opacity=".92"></path>
      <circle cx="43" cy="3.6" r="1.5" fill="#E8A9C2" opacity=".85"></circle>
    </svg>
  </footer>
</main>

<!-- 背景装饰：角落月牙 + 花瓣 + 一点星，极淡，不参与布局 -->
<div class="bg" aria-hidden="true">
  <span class="moon">
    <svg viewBox="0 0 200 200" width="100%" height="100%" fill="none">
      <path d="M136 34a76 76 0 1 0 0 132 88 88 0 0 1 0-132Z" fill="#F6C8DA"></path>
    </svg>
  </span>
  <span class="bloom">
    <svg viewBox="0 0 200 200" width="100%" height="100%" fill="none">
      <circle cx="78" cy="64" r="27" fill="#F3B8CF"></circle>
      <circle cx="120" cy="62" r="24" fill="#F7CFDE"></circle>
      <circle cx="63" cy="96" r="20" fill="#F7CFDE"></circle>
      <circle cx="128" cy="94" r="26" fill="#F2AEC8"></circle>
      <circle cx="96" cy="116" r="21" fill="#F6C6D8"></circle>
      <circle cx="98" cy="84" r="13" fill="#EE9DBE"></circle>
    </svg>
  </span>
  <span class="star">
    <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none"
         stroke="#E8A9C2" stroke-width="1.2" stroke-linecap="round">
      <path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4"></path>
    </svg>
  </span>
</div>

<script>
/* ==========================================================================
   MiniMQTT - 手写的最小 MQTT 3.1.1 over WebSocket 客户端（无任何外部依赖）
   只用到：CONNECT / PUBLISH / SUBSCRIBE / PINGREQ / DISCONNECT
   ========================================================================== */
(function(){
  var TE = new TextEncoder(), TD = new TextDecoder();
  function u16(n){ return [ (n>>8)&255, n&255 ]; }
  function len(n){ var o=[]; do { var d=n%128; n=Math.floor(n/128); if(n>0) d|=128; o.push(d); } while(n>0); return o; }
  function cat(){ var t=0,i; for(i=0;i<arguments.length;i++) t+=arguments[i].length;
    var o=new Uint8Array(t),p=0; for(i=0;i<arguments.length;i++){ o.set(arguments[i],p); p+=arguments[i].length; } return o; }
  function mstr(s){ var b=TE.encode(s); return cat(new Uint8Array(u16(b.length)), b); }
  function packet(type, flags, body){ var L=len(body.length);
    var h=new Uint8Array(1+L.length); h[0]=(type<<4)|flags; h.set(L,1); return cat(h, body); }

  function Mini(url, opts){
    var self=this;
    opts = opts || {};
    self.url=url; self.clientId=opts.clientId||('c'+Math.random().toString(36).slice(2,10));
    self.keepalive=opts.keepalive||45;
    self.will=opts.will||null;
    self.onopen=null; self.onconnect=null; self.onmessage=null;
    self.onclose=null; self.onerror=null; self.onsuback=null;
    self.connected=false; self.ended=false; self.reconnects=0;
    self.pid=0; self.buf=new Uint8Array(0); self.pingTimer=null; self.tries=0;

    function fail(msg){ if(self.onerror) self.onerror(msg); }

    function handle(b0, p){
      var type=b0>>4;
      if(type===2){                                  // CONNACK
        if(p.length<2) return;
        var rc=p[1];
        if(rc===0){
          self.connected=true; self.tries=0;
          self.pingTimer=setInterval(function(){ raw(packet(12,0,new Uint8Array(0))); }, self.keepalive*1000/2);
          if(self.onconnect) self.onconnect();
        } else { fail('CONNACK rc='+rc); self.close(); }
      } else if(type===3){                           // PUBLISH
        var qos=(b0>>1)&3, retain=(b0&1)===1;
        var tl=(p[0]<<8)|p[1]; var off=2+tl;
        if(p.length<off) return;
        var topic=TD.decode(p.subarray(2,off));
        if(qos>0) off+=2;
        var payload=TD.decode(p.subarray(off));
        if(self.onmessage) self.onmessage(topic, payload, retain);
      } else if(type===9){                           // SUBACK
        if(self.onsuback) self.onsuback(p);
      }
    }

    function onData(u8){
      var nb=new Uint8Array(self.buf.length+u8.length);
      nb.set(self.buf); nb.set(u8, self.buf.length); self.buf=nb;
      while(self.buf.length>=2){
        var i=1, mult=1, l=0, done=false;
        while(i<self.buf.length && i<=4){
          var d=self.buf[i]; l+=(d&127)*mult; mult*=128; i++;
          if((d&128)===0){ done=true; break; }
        }
        if(!done) return;
        if(self.buf.length < i+l) return;
        handle(self.buf[0], self.buf.slice(i, i+l));
        self.buf=self.buf.slice(i+l);
      }
    }

    var ws=null;
    function raw(bytes){ try{ if(ws && ws.readyState===1) ws.send(bytes); }catch(e){ fail(String(e)); } }

    self.connect=function(){
      if(self.ended) return;
      try{ ws=new WebSocket(self.url); }catch(e){ fail(String(e)); return; }
      ws.binaryType='arraybuffer';
      ws.onopen=function(){
        var flags = (1<<1);                                   // clean session
        var payload = mstr(self.clientId);
        if(self.will){ flags |= (1<<2)|(1<<5); payload = cat(payload, mstr(self.will.topic), TE.encode(self.will.payload||'')); }
        var vh = cat(mstr('MQTT'), new Uint8Array([4, flags]), new Uint8Array(u16(self.keepalive)));
        raw(packet(1, 0, cat(vh, payload)));
        if(self.onopen) self.onopen();
      };
      ws.onmessage=function(e){ onData(new Uint8Array(e.data)); };
      ws.onerror=function(){ fail('websocket error'); };
      ws.onclose=function(){
        self.connected=false;
        if(self.pingTimer){ clearInterval(self.pingTimer); self.pingTimer=null; }
        if(self.onclose) self.onclose();
        /* 指数退避：1.5s, 3s, 6s, …… 上限 30s，最多 8 次 */
        if(!self.ended && self.tries<8){
          self.tries++;
          var wait=Math.min(30000, 1500*Math.pow(2,self.tries-1));
          setTimeout(self.connect, wait);
        }
      };
    };

    self.subscribe=function(topic, qos){
      if(!self.connected) return false;
      self.pid++;
      raw(packet(8, 2, cat(new Uint8Array(u16(self.pid)), mstr(topic), new Uint8Array([qos||0]))));
      return true;
    };
    self.publish=function(topic, payload, opt){
      if(!self.connected) return false;
      opt=opt||{};
      raw(packet(3, opt.retain?1:0, cat(mstr(topic), TE.encode(payload==null?'':String(payload)))));
      return true;
    };
    self.close=function(){ self.ended=true;
      if(self.pingTimer){ clearInterval(self.pingTimer); self.pingTimer=null; }
      try{ raw(packet(14,0,new Uint8Array(0))); }catch(e){}
      try{ if(ws) ws.close(); }catch(e){}
      self.connected=false;
    };
    self.isConnected=function(){ return self.connected; };
  }
  window.MiniMQTT = Mini;
})();
</script>

<script>
/* ==========================================================================
   两个气泡，两条独立通道
     kws/sec/<ROOM>/p  对应 潘潘那个框
     kws/sec/<ROOM>/m  对应 萌萌那个框
   各自独立收发，互不干扰（不是两个人共用一份文档）
   ========================================================================== */
(function(){
  "use strict";

  var Q = (function(){ var o={},s=location.search.replace(/^\?/,''); if(s) s.split('&').forEach(function(kv){
      var a=kv.split('='); if(a[0]) o[decodeURIComponent(a[0])]=decodeURIComponent(a[1]||''); }); return o; })();
  var ROOM = ((Q.get ? Q.get('r') : Q['r']) || '').replace(/[^A-Za-z0-9_-]/g,'').slice(0,32) || 'womens-own-secret';
  var BROKER = 'wss://broker.hivemq.com:8884/mqtt';
  var CID = 'c' + Math.random().toString(36).slice(2,10);

  /* 两个通道的定义：谁、哪个输入框、哪个主题、本机存储键
     init 故意留空 —— 框里不预填任何人名，只给 placeholder 引导。
     pv  = 这个人的「到场」主题（对方打开发一条，用来点亮「来过」提示）。 */
  var CHANNELS = [
    { key:'p', name:'潘潘', topic:'kws/sec/'+ROOM+'/p', tip:'kws/sec/'+ROOM+'/ptyp',
      pv:'kws/sec/'+ROOM+'/pv',
      input:'in-p', time:'time-p', typing:'typ-p', st:'st-p',
      store:'kwsec_'+ROOM+'_p' },
    { key:'m', name:'萌萌', topic:'kws/sec/'+ROOM+'/m', tip:'kws/sec/'+ROOM+'/mtyp',
      pv:'kws/sec/'+ROOM+'/mv',
      input:'in-m', time:'time-m', typing:'typ-m', st:'st-m',
      store:'kwsec_'+ROOM+'_m' }
  ];

  /* 旧版曾把名字预填进框里（潘潘 / 萌萌）。老用户的本机存档里可能还挂着这两个字，
     一律当作「没写过」—— 不然升级上来框里还是个人名，跟没改一样。 */
  var LEGACY_INIT = { p:'潘潘', m:'萌萌' };

  /* 每个通道的运行时状态 */
  var chState = {};
  CHANNELS.forEach(function(c){
    chState[c.key] = { text:'', ts:0, typing:false, pending:null, sendTimer:null,
                       typingTimer:null, legacy:false, acked:null,
                       els:{}, _selfWrite:false };
  });

  var cli = null;
  var stats = { connectAt:0, pubOK:0, pubSkipNoConn:0, recv:0, recvOwnEcho:0,
                recvDeferred:0, typingEvt:0, chans:{} };
  CHANNELS.forEach(function(c){ stats.chans[c.key] = { sent:0, got:0 }; });
  window.__kwStats = stats;

  /* ---------- 本地兜底 ---------- */
  function loadLocal(c){
    try{ var s = localStorage.getItem(c.store); if(s){ var d = JSON.parse(s);
      if(d && typeof d.t === 'string'){ return { t:d.t, ts:d.ts||0 }; } } }catch(e){}
    return null;
  }
  function persist(c){
    var st = chState[c.key];
    try{ localStorage.setItem(c.store, JSON.stringify({ t:st.text, ts:st.ts })); }catch(e){}
  }

  /* ---------- 相对时间 ---------- */
  function rel(ts){
    if(!ts) return '';
    var s = Math.floor((Date.now() - ts) / 1000);
    if(s < 0) s = 0;
    if(s < 45) return '刚刚';
    if(s < 3600) return Math.floor(s/60) + ' 分钟前';
    if(s < 86400) return Math.floor(s/3600) + ' 小时前';
    if(s < 86400*30) return Math.floor(s/86400) + ' 天前';
    var d = new Date(ts);
    return (d.getMonth()+1) + ' 月 ' + d.getDate() + ' 日';
  }
  function paintTimes(){
    CHANNELS.forEach(function(c){
      var st = chState[c.key];
      var el = st.els.time;
      if(!el) return;
      el.textContent = st.ts ? rel(st.ts) : '还没写过';
    });
  }
  /* 10 秒刷一次：让「刚刚」切到「1 分钟前」更跟得上手。 */
  setInterval(paintTimes, 10000);

  /* ---------- 输入框自动长高（不出内部滚动条） ----------
     底限 44px 与 CSS 的 min-height 对齐：空框也稳稳有 44px 高，
     内容多了按 scrollHeight 长，绝不出现内部滚动条。 */
  function autoGrow(el){
    el.style.height = 'auto';
    var v = el.scrollHeight || 0;
    el.style.height = Math.max(44, v) + 'px';
  }
  window.__kwAutoGrow = autoGrow;

  /* ---------- 送达回执 ----------
     冷启动时连上会把两个框都补推一遍（不是用户刚写的），那种不算「刚送到」，
     不点灯；只有用户真改动过（acked===null 表示「这次改动还没交代」）才给回执。
     发送中不显示（不闪）：一改动先清空，等这一轮 publish 有结果了再写。 */
  function paintReceipt(c){
    var st = chState[c.key], el = st.els.st;
    if(!el) return;
    if(st.acked === null){ el.classList.remove('on'); el.textContent = ''; return; }
    el.textContent = st.acked ? '已送到' : '待发送';
    el.classList.add('on');
  }

  /* ---------- 发送 ---------- */
  function publishChan(c){
    var st = chState[c.key];
    st.ts = Date.now();
    persist(c);
    var out = { t: st.text, ts: st.ts, n: c.name, cid: CID };
    if(cli && cli.isConnected()){
      cli.publish(c.topic, JSON.stringify(out), { retain:true });
      stats.pubOK++; stats.chans[c.key].sent++;
      if(st.acked === null) st.acked = true;      /* 用户改动 → 真送到了，点「已送到」 */
    } else {
      /* 没连上 = 这次改动只有本机知道，先存着，连上后 onconnect 会补推 */
      stats.pubSkipNoConn++;
      if(st.acked === null) st.acked = false;     /* 用户改动 → 还没送出去，点「待发送」 */
    }
    paintReceipt(c);
    paintTimes();
  }
  function scheduleSend(c){
    var st = chState[c.key];
    if(st.sendTimer) clearTimeout(st.sendTimer);
    st.sendTimer = setTimeout(function(){ st.sendTimer = null; publishChan(c); }, 220);
  }

  /* ---------- 对方正在输入… ---------- */
  function sendTyping(c){
    if(!cli || !cli.isConnected()) return;
    cli.publish(c.tip, JSON.stringify({ on:true, cid: CID, n: c.name }), {});
  }

  /* ---------- 应用一条远端消息 ---------- */
  function applyRemote(c, d){
    var st = chState[c.key];
    if(st.typing){
      /* 正在打字：先攒着，绝不覆盖（否则光标被抢、输入被打断） */
      st.pending = { t: (d.t == null ? '' : String(d.t)), ts: d.ts || Date.now() };
      stats.recvDeferred++; stats.chans[c.key].got++;
      return;
    }
    st.text = (d.t == null ? '' : String(d.t));
    st.ts = d.ts || Date.now();
    st._selfWrite = true;
    st.els.in.value = st.text;
    autoGrow(st.els.in);
    st._selfWrite = false;
    persist(c);
    paintTimes();
    stats.chans[c.key].got++;
  }

  /* ---------- 「TA 来过」 ----------
     对方一打开这一页，就往他自己那条 pv 主题发一条到场信号。
     我这边收到对方的 pv → 浮出「XX来过」，1.8 秒后自己淡掉，不留占位。
     全部是装饰：连不上 / 收不到，都只是这条提示不出现，其它一律照常。 */
  var pvEl = null, pvOutTimer = null;
  function showPresence(name){
    if(!pvEl) return;
    pvEl.textContent = name + '来过';
    pvEl.classList.remove('fade');
    pvEl.classList.add('show');
    if(pvOutTimer) clearTimeout(pvOutTimer);
    pvOutTimer = setTimeout(function(){          /* 过一两秒淡掉，不永久挂着 */
      pvEl.classList.add('fade');
      pvOutTimer = setTimeout(function(){ pvEl.classList.remove('show'); }, 560);
    }, 1800);
  }
  /* 打开发一条到场信号（连上之前发不出去没关系，onconnect 那里会补发） */
  function announcePresence(){
    if(!cli || !cli.isConnected()) return;
    CHANNELS.forEach(function(c){
      cli.publish(c.pv, JSON.stringify({ n: c.name, cid: CID, ts: Date.now() }), {});
    });
  }

  /* ---------- 收到消息 ---------- */
  function onMessage(topic, payload){
    var c = null, i;
    for(i=0;i<CHANNELS.length;i++){ if(CHANNELS[i].topic === topic){ c = CHANNELS[i]; break; } }
    if(c){
      var d;
      try{ d = JSON.parse(payload); }catch(e){ return; }
      if(!d) return;
      /* 自己发的会被 broker 投回来，按 cid 丢弃，否则会把自己当对面 */
      if(d.cid && d.cid === CID){ stats.recvOwnEcho++; return; }
      stats.recv++;
      applyRemote(c, d);
      return;
    }
    /* 「来过」：对方的到场信号（同样按 cid 排除自己发的回声） */
    for(i=0;i<CHANNELS.length;i++){
      if(CHANNELS[i].pv === topic){
        var v; try{ v = JSON.parse(payload); }catch(e){ return; }
        if(!v || (v.cid && v.cid === CID)) return;
        showPresence(CHANNELS[i].name);
        return;
      }
    }
    /* typing 事件 */
    for(i=0;i<CHANNELS.length;i++){
      if(CHANNELS[i].tip === topic){
        var t; try{ t = JSON.parse(payload); }catch(e){ return; }
        if(!t || t.cid === CID) return;
        var st = chState[CHANNELS[i].key];
        var el = st.els.typing;
        if(t.on){
          if(el) el.classList.add('live');
          stats.typingEvt++;
          if(st.typingTimer) clearTimeout(st.typingTimer);
          st.typingTimer = setTimeout(function(){ if(el) el.classList.remove('live'); }, 3000);
        } else {
          if(st.typingTimer) clearTimeout(st.typingTimer);
          if(el) el.classList.remove('live');
        }
        return;
      }
    }
  }

  /* ---------- 状态提示（隐形） ----------
     呈现规则只有一条：**正常时什么都不显示**。
       连接中 / 已连上：浮层不出现（常态就不可见，不占位）
       掉线 / 连不上  ：浮层淡入，fixed 定位，不顶动任何布局
       恢复连上 / 用户自己写起来：自动淡出
     判定逻辑（onconnect / onclose / onerror）跟以前一模一样，只是换了呈现。 */
  var noticeEl = null, noticeTimer = null, firstFail = false;
  function noticeShow(txt){
    if(!noticeEl) return;
    var t = document.getElementById('stxt');
    if(t) t.textContent = txt;
    noticeEl.classList.add('show');
    if(noticeTimer){ clearTimeout(noticeTimer); noticeTimer = null; }
  }
  function noticeHide(){
    if(!noticeEl) return;
    noticeEl.classList.remove('show');
    if(noticeTimer){ clearTimeout(noticeTimer); noticeTimer = null; }
  }
  /* 提醒过一次就够了：用户已经在写东西，说明本机兜底生效，别再挡着 */
  function noticeRest(){
    if(noticeTimer) clearTimeout(noticeTimer);
    noticeTimer = setTimeout(noticeHide, 7000);
  }

  /* ---------- 右上角同步小绿灯 ----------
     一个点说清同步状态，不占地方、不弹字：
       淡灰 = 脚本刚跑、还没到第一次 onconnect（首次连接中）
       绿   = 已连上、同步正常
       红   = 连不上 / 掉线（自动退避重连一直在跑）
     点红灯 = 手动立刻重连一次；点绿灯 = 什么都不做（别去打断好连接）。 */
  var dotEl = null;
  function setDot(state){
    if(!dotEl) return;
    var bad = (state === 'bad');
    dotEl.classList.toggle('ok', state === 'ok');
    dotEl.classList.toggle('bad', bad);
    var label = bad ? '同步中断' : (state === 'ok' ? '同步正常' : '正在连接');
    dotEl.setAttribute('aria-label', label);
    dotEl.setAttribute('title', label);
    dotEl.style.cursor = bad ? 'pointer' : 'default';
  }
  function retryNow(){
    if(!cli) return;
    cli.tries = 0;                       /* 退避计数归零 = 立刻再试一次 */
    if(!cli.ended && !cli.isConnected()) cli.connect();
    noticeRest();
  }

  /* ---------- 页脚的日期 ---------- */
  function paintToday(){
    var el = document.getElementById('today');
    if(!el) return;
    var d = new Date();
    el.textContent = d.getFullYear() + ' 年 ' + (d.getMonth()+1) + ' 月 ' + d.getDate() + ' 日';
  }

  /* ---------- 接线 ---------- */
  function wire(){
    CHANNELS.forEach(function(c){
      var st = chState[c.key];
      var el = document.getElementById(c.input);
      st.els.in = el;
      st.els.time = document.getElementById(c.time);
      st.els.typing = document.getElementById(c.typing);
      st.els.st = document.getElementById(c.st);

      /* 初始文字：本机存档优先，没有就留空（绝不预填人名）。
         存档里若正好是本通道旧版的预填人名，同样当作没写过 —— 升级不留残影。 */
      var loc = loadLocal(c);
      if(loc && loc.t === LEGACY_INIT[c.key]){
        st.text = ''; st.ts = 0; st.legacy = true;
      } else {
        st.text = loc ? loc.t : '';
        st.ts   = loc ? loc.ts : 0;
        st.legacy = false;
      }
      st.acked = null;                       /* 还没改动过 → 不发回执 */
      st._selfWrite = true;
      el.value = st.text;
      st._selfWrite = false;
      autoGrow(el);
      paintReceipt(c);

      el.addEventListener('input', function(){
        if(st._selfWrite) return;              /* 程序写入不触发发送 */
        st.text = el.value;
        st.ts = Date.now();
        st.legacy = false;
        st.acked = null;                       /* 新改动 = 还没交代 → 先不显示回执 */
        paintReceipt(c);
        autoGrow(el);
        persist(c); paintTimes();
        noticeHide();                      /* 已经在写了 = 本机兜底生效，浮层让位给正文 */
        scheduleSend(c);
        sendTyping(c);
      });
      el.addEventListener('focus', function(){ st.typing = true; });
      el.addEventListener('blur', function(){
        st.typing = false;
        /* 失焦后把攒着的远端改动并进来 —— 本机已在打字期间发过，这边直接采纳对面最新的 */
        if(st.pending){ var p = st.pending; st.pending = null;
          applyRemote(c, { t: p.t, ts: p.ts });
        }
      });
      window.addEventListener('resize', function(){ autoGrow(el); });
    });
    paintTimes();
    paintToday();
    noticeEl = document.getElementById('notice');
    pvEl = document.getElementById('pv');
    var rt = document.getElementById('rtry');
    if(rt) rt.addEventListener('click', function(){ noticeHide(); retryNow(); });

    /* 绿灯：常态可点但不做任何事；红灯按下 = 立刻重连（跟浮层里那个「重试」等价） */
    dotEl = document.getElementById('sync-dot');
    if(dotEl){
      setDot('idle');
      dotEl.addEventListener('click', function(){
        if(dotEl.classList.contains('bad')) retryNow();
      });
    }

    /* 退出前告诉对面「我不打字了」（typing 是瞬时事件，避免残留） */
    window.addEventListener('beforeunload', function(){
      try{ if(cli && cli.isConnected()){
        CHANNELS.forEach(function(c){ cli.publish(c.tip, JSON.stringify({ on:false, cid: CID }), {}); });
      } }catch(e){}
    });
  }

  /* ---------- 连接 ---------- */
  function connect(){
    /* 这里的「静默」不是把提示删了：判定逻辑一条没少，只是首次连上之前不吭声 */
    noticeHide();
    setDot('idle');                       /* 绿灯先回淡灰：正在建连 */
    firstFail = false;
    cli = new MiniMQTT(BROKER, {
      clientId: 'kwsec-' + CID,
      keepalive: 45,
      clean: true
    });
    cli.onconnect = function(){
      stats.connectAt = Date.now();
      setDot('ok');                       /* 连上 = 小绿灯变绿 */
      noticeHide();                       /* 连上 = 浮层消失（常态就是隐形） */
      CHANNELS.forEach(function(c){
        cli.subscribe(c.topic, 0);
        cli.subscribe(c.tip, 0);
        cli.subscribe(c.pv, 0);           /* 也订上「来过」主题 */
      });
      /* 补一次到场信号：页面刚打开时还没连上，这次一起补发（含重连） */
      announcePresence();
      /* 连上后把两个框的本机内容都推一次：既是补推离线改动，
         也保证新来的一方能立刻看到对方已有的字（retain 主题） */
      CHANNELS.forEach(function(c){
        publishChan(c);
        /* 之前是「待发送」（存在本机没出去）的，这一轮补推出去了 → 改回「已送到」 */
        if(chState[c.key].acked === false){ chState[c.key].acked = true; paintReceipt(c); }
      });
    };
    cli.onmessage = onMessage;
    cli.onclose = function(){
      /* 第一次掉线才出声（浮出来 = 背后自动重连）；连上过一次之后的掉线也一样 */
      setDot('bad');                      /* 掉线 = 小绿灯变红 */
      noticeShow('暂时连不上，先存在本机，等下自己重连');
      firstFail = true;
      noticeRest();
    };
    cli.onerror = function(){
      setDot('bad');                      /* 连不上 = 小绿灯变红 */
      if(firstFail) return;               /* 重连失败不重复刷屏 */
      noticeShow('暂时连不上，先存在本机，等下自己重连');
      firstFail = true;
      noticeRest();
    };
    cli.connect();
  }

  /* ---------- 启动 ---------- */
  wire();
  connect();
})();
</script>
</body>
