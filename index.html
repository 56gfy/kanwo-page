<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAF6EF">
<title>我们的故事</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(130% 80% at 50% 0%,#FFFDF9 0%,#FAF6EF 46%,#F4EEE3 100%);
  background-attachment:fixed;
  color:#2A2622;
  font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
main{
  padding:calc(env(safe-area-inset-top,0px) + 34px) 22px
          calc(env(safe-area-inset-bottom,0px) + 46px);
  max-width:640px;margin:0 auto;
}

/* ---------- 头 ---------- */
.hd{text-align:center;margin-bottom:34px}
.to{
  margin:0 0 16px;font-size:12px;letter-spacing:.42em;
  text-indent:.42em;color:#BC9C60;
}
h1{
  margin:0;font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
  font-size:clamp(31px,9.6vw,44px);line-height:1.24;font-weight:600;
  letter-spacing:.05em;color:#241F1B;
}
h1 .sub{
  display:block;margin-top:8px;font-size:.6em;font-weight:400;
  letter-spacing:.2em;text-indent:.2em;color:#B23A2E;
}
.rule{
  width:46px;height:1px;margin:26px auto 0;
  background:linear-gradient(90deg,transparent,#C9A75F,transparent);
}

/* ---------- 照片 ---------- */
.wall{display:block}
.wrap{margin:0 0 30px}
.wrap:last-child{margin-bottom:0}
.shot{
  position:relative;margin:0;background:#FFFEFB;
  padding:9px 9px 31px;
  border-radius:1px;
  box-shadow:0 13px 30px -15px rgba(74,50,26,.42),
             0 3px 9px -5px rgba(74,50,26,.16);
}
.shot img{
  display:block;width:100%;height:auto;border-radius:1px;background:#EFE8DC;
}
.no{
  position:absolute;left:11px;right:11px;bottom:9px;
  font-size:9.5px;line-height:1;letter-spacing:.26em;
  color:#C6A96D;text-align:right;
  font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
.rot-l{rotate:-1.25deg}
.rot-r{rotate:1.05deg}

.duo{display:flex;gap:14px;align-items:flex-start;margin:0 0 30px}
.duo .wrap{flex:1 1 0;min-width:0;margin-bottom:0}
.duo .shot{padding:7px 7px 27px}
.duo .shot img{aspect-ratio:3/4;object-fit:cover;height:auto}
.duo .no{left:9px;right:9px;bottom:8px;font-size:8.5px;letter-spacing:.2em}

/* ---------- 尾 ---------- */
.ft{text-align:center;margin-top:44px}
.ft .line{
  width:92px;height:1px;margin:0 auto 26px;
  background:linear-gradient(90deg,transparent,#DCC9A6,transparent);
}
.seal{
  display:inline-block;width:30px;height:30px;line-height:30px;
  background:#B23A2E;color:#FFF6F2;border-radius:2px;
  font-family:"Songti SC","STSong","SimSun",serif;
  font-size:15px;letter-spacing:0;text-align:center;
  box-shadow:0 4px 12px -6px rgba(178,58,46,.7);
}
.date{
  margin:14px 0 0;font-size:11px;letter-spacing:.3em;
  text-indent:.3em;color:#A79C8B;
  font-family:"Songti SC","STSong","SimSun",serif;
}

/* ---------- 入场（脚本可用时才启用）---------- */
.js .wrap{opacity:0;transform:translateY(18px)}
.js .wrap.in{
  opacity:1;transform:translateY(0);
  transition:opacity .78s ease,transform .78s cubic-bezier(.22,.7,.24,1);
}
@media (prefers-reduced-motion:reduce){
  .js .wrap,.js .wrap.in{opacity:1;transform:none;transition:none}
}
</style>
</head>
<body>

<main>
  <header class="hd">
    <p class="to">小蒙</p>
    <h1>我们的故事<span class="sub">才刚刚开始</span></h1>
    <div class="rule"></div>
  </header>

  <section class="wall">

    <div class="wrap rot-l">
      <figure class="shot">
        <img src="photos/p1.jpg" alt="" width="720" height="1280">
        <figcaption class="no">01</figcaption>
      </figure>
    </div>

    <div class="wrap">
      <figure class="shot">
        <img src="photos/p2.jpg" alt="" width="1100" height="988">
        <figcaption class="no">02</figcaption>
      </figure>
    </div>

    <div class="duo">
      <div class="wrap rot-l">
        <figure class="shot">
          <img src="photos/p3.jpg" alt="" width="1100" height="1467" loading="lazy">
          <figcaption class="no">03</figcaption>
        </figure>
      </div>
      <div class="wrap rot-r">
        <figure class="shot">
          <img src="photos/p4.jpg" alt="" width="1080" height="1920" loading="lazy">
          <figcaption class="no">04</figcaption>
        </figure>
      </div>
    </div>

    <div class="wrap">
      <figure class="shot">
        <img src="photos/p5.jpg" alt="" width="1100" height="1467" loading="lazy">
        <figcaption class="no">05</figcaption>
      </figure>
    </div>

    <div class="wrap rot-r">
      <figure class="shot">
        <img src="photos/p6.jpg" alt="" width="1100" height="1467" loading="lazy">
        <figcaption class="no">06</figcaption>
      </figure>
    </div>

  </section>

  <footer class="ft">
    <div class="line"></div>
    <span class="seal">蒙</span>
    <p class="date">二〇二六年九月</p>
  </footer>
</main>

<script>
/* 入场动画：脚本可用才启用，且【绝不允许内容永久停在看不见】。
   IntersectionObserver 快速滑动会整段漏触发 → 挂 scroll 兜底 + 定时强揭。 */
(function(){
  var root=document.documentElement;
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    return;
  }
  root.classList.add('js');
  var nodes=[].slice.call(document.querySelectorAll('.wrap'));
  var pending=nodes.slice();

  function sweep(final){
    if(!pending.length) return;
    var limit=window.innerHeight*1.02;
    for(var i=pending.length-1;i>=0;i--){
      var el=pending[i];
      if(final||el.getBoundingClientRect().top<=limit){
        el.classList.add('in');
        pending.splice(i,1);
      }
    }
  }

  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){
      es.forEach(function(e){
        if(!e.isIntersecting) return;
        e.target.classList.add('in');
        var i=pending.indexOf(e.target);
        if(i>=0) pending.splice(i,1);
        io.unobserve(e.target);
      });
    },{rootMargin:'0px 0px -8% 0px',threshold:.06});
    nodes.forEach(function(n){io.observe(n);});
  } else {
    sweep(true);
  }

  window.addEventListener('scroll',function(){sweep(false);},{passive:true});
  window.addEventListener('resize',function(){sweep(false);},{passive:true});
  window.addEventListener('load',function(){sweep(false);});
  setTimeout(function(){sweep(true);},2400);
  sweep(false);
})();
</script>
</body>
</html>
