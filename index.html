<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>看我</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --blue:#007AFF; --ink:#1C1C1E; --ink2:#6E6E73; --line:#E5E5EA;
    --card:#FFFFFF; --bg:#F2F2F7;
    --font:-apple-system,"SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  html,body{background:var(--bg);}
  body{
    font-family:var(--font); color:var(--ink);
    min-height:100vh; -webkit-font-smoothing:antialiased;
    /* 顶部留白交给原生导航栏，网页这侧不再加，否则会空两倍 */
    padding:24px 20px 40px;
  }
  .hero{text-align:center;padding:16px 0 28px}
  .mark{
    width:88px;height:88px;margin:0 auto 18px;
    border-radius:22.37%;position:relative;overflow:hidden;
    background:linear-gradient(140deg,#5AC8FA 0%,#0A84FF 100%);
    box-shadow:0 10px 26px rgba(0,122,255,.28);
  }
  .mark svg{position:absolute;inset:0;width:100%;height:100%}
  h1{font-size:28px;font-weight:700;letter-spacing:-.4px}
  .sub{margin-top:8px;font-size:15px;color:var(--ink2);line-height:1.5}
  .card{
    background:var(--card);border-radius:14px;padding:18px 18px;
    margin:0 0 14px;box-shadow:0 1px 2px rgba(0,0,0,.04);
  }
  .card h2{font-size:16px;font-weight:600;margin-bottom:10px}
  .card p{font-size:14.5px;line-height:1.72;color:var(--ink2)}
  code{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:12.5px;background:#F2F2F7;border-radius:5px;padding:2px 6px;color:var(--ink);
  }
  .steps{list-style:none;counter-reset:s}
  .steps li{
    counter-increment:s;position:relative;padding:9px 0 9px 32px;
    font-size:14.5px;line-height:1.6;color:var(--ink);
    border-bottom:1px solid var(--line);
  }
  .steps li:last-child{border-bottom:0}
  .steps li::before{
    content:counter(s);position:absolute;left:0;top:9px;
    width:20px;height:20px;border-radius:50%;background:var(--blue);color:#fff;
    font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;
  }
  .foot{text-align:center;font-size:12.5px;color:#A1A1A6;padding:18px 0 4px;line-height:1.7}
  .ok{display:inline-flex;align-items:center;gap:6px;color:#34C759;font-weight:600;font-size:13px}
  .dot{width:7px;height:7px;border-radius:50%;background:#34C759;display:inline-block}
</style>
</head>
<body>

  <div class="hero">
    <div class="mark">
      <svg viewBox="0 0 100 100" fill="none" aria-hidden="true">
        <path d="M12 50 C12 50 30 24 50 24 C70 24 88 50 88 50 C88 50 70 76 50 76 C30 76 12 50 12 50 Z"
              fill="#fff"/>
        <circle cx="50" cy="50" r="17" fill="#0A84FF"/>
        <circle cx="50" cy="50" r="7.5" fill="#fff"/>
      </svg>
    </div>
    <h1>看我</h1>
    <div class="sub">一个壳，里面装你的网页<br>换页不用重新装 App</div>
  </div>

  <div class="card">
    <h2>这一页是样例</h2>
    <p>
      你现在看到的这个页面放在 GitHub 仓库里。想要换成你自己的内容，
      直接改仓库里那个 <code>index.html</code> 就行 ——
      App 里点一下右上角的刷新，看到的就是新版。
    </p>
  </div>

  <div class="card">
    <h2>怎么换内容</h2>
    <ul class="steps">
      <li>打开 GitHub，进这个仓库</li>
      <li>编辑 <code>index.html</code>（也可以传一整个网页目录）</li>
      <li>提交，等十几秒</li>
      <li>App 右上角点刷新</li>
    </ul>
  </div>

  <div class="card">
    <h2>想换成别的网址也行</h2>
    <p>
      左上角进设置，把来源改成「网页地址」，填上任何网址就行。
      两种来源随时能切换。
    </p>
  </div>

  <div class="foot">
    <span class="ok"><span class="dot"></span>已连上</span><br>
    内容托管在 GitHub · 由「看我」呈现
  </div>

</body>
</html>
